          <dt>Centro de Custo:</dt>
          <dd>${U.esc(sc.centroCusto || '—')}</dd>

          <dt>Local de Entrega:</dt>
          <dd>${U.esc(sc.localEntrega || '—')}</dd>

          <dt>Quantidade:</dt>
          <dd><span class="strong" style="font-size:16px">${U.num(sc.qtd)} ${U.esc(sc.unid)}</span></dd>

          <dt>Item no Catálogo:</dt>
          <dd>${sc.itemCodigo ? `<span class="badge badge-info">${U.esc(sc.itemCodigo)}</span>` : '<span class="muted">Não vinculado</span>'}</dd>

          <dt>Especificação Técnica:</dt>
          <dd style="white-space:pre-wrap">${U.esc(sc.especificacao || 'Nenhuma especificação adicional.')}</dd>

          <dt>Observações:</dt>
          <dd style="white-space:pre-wrap">${U.esc(sc.obs || 'Nenhuma observação.')}</dd>
        </div>

        <div class="notice info" style="margin-top:8px">
          <div>
            <strong>Rastreabilidade do Ciclo de Compra:</strong><br>
            ${cot ? `• Cotação gerada: <strong>${cot.id}</strong> (Status: ${cot.status})<br>` : '• Nenhuma cotação vinculada até o momento.<br>'}
            ${pedido ? `• Pedido emitido: <strong>${pedido.id}</strong> (Status: ${pedido.status})` : '• Pedido de compra ainda não gerado.'}
          </div>
        </div>
      </div>
    `;

    // Montando botões extras no rodapé
    let botoesRodape = '';
    if (sc.status === 'Aberta') {
      botoesRodape = `<button type="button" class="btn btn-primary" onclick="Compras.cotarSC('${sc.id}')">${Icon('scale')} Iniciar Cotação</button>`;
    } else if (cot) {
      botoesRodape = `<button type="button" class="btn btn-outline-orange" onclick="App.go('cotacoes', { id: '${cot.id}' })">${Icon('scale')} Abrir Cotação ${cot.id}</button>`;
    }

    // Exibindo modal de detalhes
    UI.modal({
      title: `Detalhes da Solicitação ${sc.id}`,
      sub: `${sc.cliente} · ${sc.descricao}`,
      size: 'lg',
      body: html,
      hideSubmit: true,
      cancelLabel: 'Fechar',
      extraFoot: botoesRodape
    });
  },

  // Ação para cancelar uma solicitação aberta
  cancelarSC(scId) {
    // Buscando a solicitação
    const sc = Store.sc(scId);
    if (!sc) return;

    // Solicitando confirmação antes de alterar o status
    UI.confirm(
      `Deseja realmente cancelar a Solicitação de Compra <strong>${sc.id}</strong> (${sc.descricao})?`,
      () => {
        // Atualizando o status para Cancelada
        sc.status = 'Cancelada';
        // Persistindo e re-renderizando a interface
        Store.commit(`Solicitação ${sc.id} cancelada com sucesso.`, 'warning');
      },
      { title: 'Confirmar Cancelamento', yesLabel: 'Sim, Cancelar' }
    );
  },

  // Transforma uma SC aberta em processo de Cotação
  cotarSC(scId) {
    // Localizando a solicitação
    const sc = Store.sc(scId);
    if (!sc) return;

    // Verificando se já existe cotação criada para esta solicitação
    let cot = Store.cotBySc(scId);

    // Se não existir cotação, gera uma nova estrutura comparativa
    if (!cot) {
      const proximoCotId = Store.nextId('COT-', Store.db.cotacoes);
      const usuarioLogado = Store.user();

      // Buscando fornecedor padrão se o item for de catálogo
      const itemEstoque = sc.itemCodigo ? Store.item(sc.itemCodigo) : null;
      const fornecedorPadrao = itemEstoque?.fornecedorId || '';
      const precoPadrao = itemEstoque?.ultimoPreco || 0;

      // Criando a cotação com 3 colunas de ofertas vazias/pré-carregadas
      cot = {
        id: proximoCotId,
        scId: sc.id,
        data: U.today(),
        compradora: usuarioLogado.nome,
        ofertas: [
          { fornecedorId: fornecedorPadrao, valor: precoPadrao, frete: 0, prazo: 3, pagamento: 'Boleto 28 dias' },
          { fornecedorId: '', valor: 0, frete: 0, prazo: 0, pagamento: 'Boleto 28 dias' },
          { fornecedorId: '', valor: 0, frete: 0, prazo: 0, pagamento: 'Boleto 28 dias' },
        ],
        escolhida: 0,
        justificativa: '',
        status: 'Em cotação',
        nivelRequerido: 1,
        historico: [
          {
            data: U.today(),
            usuario: usuarioLogado.nome,
            acao: 'Cotação iniciada',
            obs: `Cotação comparativa aberta para atendimento da SC ${sc.id}`
          }
        ]
      };

      // Adicionando à lista de cotações
      Store.db.cotacoes.unshift(cot);
    }

    // Atualizando o status da SC para "Em cotação"
    sc.status = 'Em cotação';

    // Salvando alterações e navegando diretamente para o Mapa de Cotação
    Store.save();
    UI.toast(`Cotação ${cot.id} iniciada para ${sc.id}.`, 'info');
    App.go('cotacoes', { id: cot.id });
  },

  // Abre diretamente a cotação vinculada a uma SC
  abrirCotacaoPorSC(scId) {
    const cot = Store.cotBySc(scId);
    if (cot) {
      App.go('cotacoes', { id: cot.id });
    } else {
      this.cotarSC(scId);
    }
  },

  /* ===================================================================
     MÉTODOS DA PÁGINA: MAPA DE COTAÇÃO COMPARATIVO
     =================================================================== */

  // Atualiza a aba selecionada na listagem de cotações
  setTabCot(abaId) {
    this._cotFiltros.aba = abaId;
    App.rerender();
  },

  // Atualiza busca na tela de cotações
  filtrarCot(campo, valor) {
    this._cotFiltros[campo] = valor;
    App.rerender();
  },

  // Volta para a visualização geral da lista de cotações
  voltarListaCotacoes() {
    App.go('cotacoes', {});
  },

  // Atualiza campo de uma das 3 ofertas do mapa de cotação
  atualizarOferta(cotId, indexOferta, campo, valor) {
    // Localizando a cotação
    const cot = Store.cot(cotId);
    if (!cot) return;

    // Garantindo que a lista de ofertas existe
    cot.ofertas = cot.ofertas || [];
    while (cot.ofertas.length < 3) {
      cot.ofertas.push({ fornecedorId: '', valor: 0, frete: 0, prazo: 0, pagamento: 'Boleto 28 dias' });
    }

    // Atualizando a propriedade específica
    if (campo === 'fornecedorId' || campo === 'pagamento') {
      cot.ofertas[indexOferta][campo] = valor;
    } else {
      cot.ofertas[indexOferta][campo] = U.parseNum(valor);
    }

    // Recalculando a análise comparativa após alteração
    const analise = Rules.cotacao(cot);
    if (cot.escolhida == null || cot.escolhida < 0) {
      cot.escolhida = analise.menorIdx >= 0 ? analise.menorIdx : 0;
    }

    // Salvando alterações e atualizando o DOM da tela de cotações
    Store.save();
    App.rerender();
  },

  // Seleciona a oferta vencedora pelo índice (0, 1 ou 2)
  selecionarOferta(cotId, indexOferta) {
    const cot = Store.cot(cotId);
    if (!cot) return;

    // Definindo o índice da oferta escolhida
    cot.escolhida = Number(indexOferta);
    Store.save();
    App.rerender();
  },

  // Atualiza a justificativa técnica/comercial da cotação
  atualizarJustificativa(cotId, texto) {
    const cot = Store.cot(cotId);
    if (!cot) return;
    cot.justificativa = texto.trim();
    Store.save();
  },

  // Salva o rascunho da cotação em edição
  salvarRascunhoCotacao(cotId) {
    const cot = Store.cot(cotId);
    if (!cot) return;

    // Lendo o campo de justificativa da tela se houver
    const campoJust = document.getElementById('f_cot_justificativa');
    if (campoJust) {
      cot.justificativa = campoJust.value.trim();
    }

    // Registrando commit de rascunho
    Store.commit(`Rascunho da Cotação ${cot.id} salvo com sucesso!`, 'info');
  },

  // Valida regras de negócio e encaminha a cotação para a Central de Aprovação
  enviarParaAprovacao(cotId) {
    // Buscando a cotação e a solicitação de compra
    const cot = Store.cot(cotId);
    if (!cot) return;
    const sc = Store.sc(cot.scId);
    if (!sc) return;

    // Atualizando o texto da justificativa a partir do elemento na tela
    const campoJust = document.getElementById('f_cot_justificativa');
    if (campoJust) {
      cot.justificativa = campoJust.value.trim();
    }

    // Executando análise das 3 ofertas pela regra pura de negócio
    const analise = Rules.cotacao(cot);

    // Validação 1: Pelo menos uma oferta válida deve estar cadastrada
    if (analise.validas === 0) {
      UI.toast('Preencha ao menos uma proposta válida de fornecedor para prosseguir.', 'error');
      return;
    }

    // Validação 2: Oferta escolhida deve ser válida
    if (analise.totais[cot.escolhida] == null) {
      UI.toast('A oferta vencedora selecionada não possui fornecedor ou valor preenchido.', 'error');
      return;
    }

    // Validação 3: Justificativa obrigatória se houver menos de 3 cotações ou se a oferta não for a menor
    if (analise.precisaJustificativa && (!cot.justificativa || !cot.justificativa.trim())) {
      UI.toast('Atenção: A justificativa é OBRIGATÓRIA quando há menos de 3 propostas ou quando a menor cotação não for selecionada.', 'error');
      if (campoJust) campoJust.focus();
      return;
    }

    // Determinando o total da compra e a alçada financeira exigida
    const totalCompra = analise.escolhido;
    const alcadaExigida = Rules.alcada(totalCompra);

    // Atualizando o nível de alçada requerido e status
    cot.nivelRequerido = alcadaExigida.nivel;
    cot.status = 'Aguardando aprovação';
    sc.status = 'Aguardando aprovação';

    // Registrando no histórico de auditoria da cotação
    cot.historico = cot.historico || [];
    cot.historico.push({
      data: U.today(),
      usuario: Store.user().nome,
      acao: 'Enviada para aprovação',
      obs: `Valor total: ${U.brl(totalCompra)} · Alçada exigida: Nível ${alcadaExigida.nivel} (${alcadaExigida.nome})`
    });

    // Persistindo alterações
    Store.commit(`Cotação ${cot.id} enviada para aprovação na alçada de ${alcadaExigida.nome}!`, 'success');

    // Redirecionando automaticamente para a Central de Aprovações
    App.go('aprovacoes');
  },

  /* ===================================================================
     MÉTODOS DA PÁGINA: CENTRAL DE APROVAÇÕES POR ALÇADA
     =================================================================== */

  // Aprova formalmente uma cotação e oferece atalho para gerar Pedido PC
  aprovarCompra(cotId) {
    // Buscando cotação e solicitação vinculada
    const cot = Store.cot(cotId);
    if (!cot) return;
    const sc = Store.sc(cot.scId);
    const usuarioAtual = Store.user();

    // Verificação de segurança de permissão de alçada
    const analise = Rules.cotacao(cot);
    const alcadaReq = Rules.alcada(analise.escolhido);

    if (usuarioAtual.nivel < (cot.nivelRequerido || alcadaReq.nivel)) {
      UI.toast(`Alçada insuficiente. Requer nível ${alcadaReq.nivel} (${alcadaReq.nome}).`, 'error');
      return;
    }

    // Atualizando status da cotação e solicitação para Aprovada
    cot.status = 'Aprovada';
    if (sc) sc.status = 'Aprovada';

    // Adicionando ao histórico de auditoria
    cot.historico = cot.historico || [];
    cot.historico.push({
      data: U.today(),
      usuario: usuarioAtual.nome,
      acao: 'Aprovada',
      obs: `Compra de ${U.brl(analise.escolhido)} aprovada pelo perfil ${usuarioAtual.perfil} (Nível ${usuarioAtual.nivel})`
    });

    // Salvando alterações no Store
    Store.save();

    // Modal de confirmação oferecendo atalho imediato para gerar Pedido PC
    UI.modal({
      title: 'Compra Aprovada com Sucesso!',
      sub: `Cotação ${cot.id} liberada para faturamento.`,
      size: 'md',
      body: `
        <div class="stack" style="gap:14px">
          <div class="notice" style="border-color:var(--success);background:var(--success-tint);color:#065F46">
            <div>${Icon('checkCircle')}</div>
            <div>
              <strong>Aprovação Homologada com Sucesso!</strong><br>
              A compra no valor de <strong>${U.brl(analise.escolhido)}</strong> foi autorizada por <strong>${usuarioAtual.nome}</strong> (${usuarioAtual.perfil}).
            </div>
          </div>
          <p style="margin:0;font-size:13px">
            Deseja emitir o <strong>Pedido de Compra (PC)</strong> formal agora para envio ao fornecedor vencedor?
          </p>
        </div>
      `,
      submitLabel: 'Gerar Pedido (PC) Agora',
      cancelLabel: 'Manter Aprovada',
      onSubmit: () => {
        Compras.gerarPedido(cot.id);
      }
    });

    App.rerender();
  },

  // Reprova uma cotação com registro obrigatório de motivo
  reprovarCompra(cotId) {
    const cot = Store.cot(cotId);
    if (!cot) return;
    const sc = Store.sc(cot.scId);
    const usuarioAtual = Store.user();

    // Modal para preenchimento do motivo de reprovação
    UI.modal({
      title: 'Reprovar Cotação de Compra',
      sub: `Cotação ${cot.id} · A cotação será devolvida para renegociação da equipe de compras.`,
      size: 'md',
      body: `
        <div class="field full">
          <label for="f_motivo_reprovacao">Motivo da Reprovação <span class="req">*</span></label>
          <textarea id="f_motivo_reprovacao" name="motivo" class="field textarea" required placeholder="Descreva claramente o motivo (ex: valor acima do orçamento, prazo incompatível, necessidade de negociar prazo de pagamento...)"></textarea>
          <span class="hint">Este parecer será registrado no histórico de auditoria da cotação.</span>
        </div>
      `,
      submitLabel: 'Confirmar Reprovação',
      cancelLabel: 'Cancelar',
      onSubmit: valores => {
        const motivo = (valores.motivo || '').trim();
        if (!motivo) {
          UI.toast('Informe o motivo da reprovação.', 'error');
          return false;
        }

        // Atualizando o status
        cot.status = 'Reprovada';
        // Devolve a solicitação de compra para o status "Em cotação" para nova rodada
        if (sc) sc.status = 'Em cotação';

        // Registrando no histórico
        cot.historico = cot.historico || [];
        cot.historico.push({
          data: U.today(),
          usuario: usuarioAtual.nome,
          acao: 'Reprovada',
          obs: `Reprovada por ${usuarioAtual.nome}: ${motivo}`
        });

        Store.commit(`Cotação ${cot.id} reprovada e devolvida para compras.`, 'warning');
      }
    });
  },

  // Gera o Pedido de Compra (PC) a partir de uma cotação aprovada
  gerarPedido(cotId) {
    // Buscando cotação, análise e solicitação
    const cot = Store.cot(cotId);
    if (!cot) return;
    const sc = Store.sc(cot.scId);
    if (!sc) return;

    // Verificando se já existe pedido emitido para esta cotação
    let pedidoExistente = Store.pedidoByCot(cotId);
    if (pedidoExistente) {
      UI.toast(`Pedido ${pedidoExistente.id} já foi emitido para esta cotação.`, 'info');
      if (App.page('pedidos')) App.go('pedidos', { id: pedidoExistente.id });
      return;
    }

    // Calculando dados da oferta escolhida
    const analise = Rules.cotacao(cot);
    const ofertaEscolhida = cot.ofertas[analise.escolhidaIdx];
    const fornecedor = Store.fornecedor(ofertaEscolhida?.fornecedorId);

    // Gerando ID sequencial do Pedido de Compra
    const proximoPcId = Store.nextId('PC-', Store.db.pedidos);
    const valorUnit = Number(ofertaEscolhida?.valor) || 0;
    const valorProdutos = valorUnit * Number(sc.qtd || 1);
    const frete = Number(ofertaEscolhida?.frete) || 0;

    // Montando a estrutura do Pedido de Compra conforme contrato
    const novoPedido = {
      id: proximoPcId,
      scId: sc.id,
      cotId: cot.id,
      data: U.today(),
      compradora: cot.compradora || Store.user().nome,
      fornecedorId: ofertaEscolhida?.fornecedorId || 'G01',
      cliente: sc.cliente,
      centroCusto: sc.centroCusto,
      descricao: sc.descricao,
      qtd: sc.qtd,
      unid: sc.unid,
      valorUnit: valorUnit,
      valorProdutos: valorProdutos,
      frete: frete,
      status: 'Pedido emitido',
      previsao: U.addDays(U.today(), Number(ofertaEscolhida?.prazo) || 4),
      pagamento: ofertaEscolhida?.pagamento || 'Boleto 28 dias',
      localEntrega: sc.localEntrega,
      responsavelRecebimento: sc.solicitante,
      transportadora: 'Transporte Próprio do Fornecedor',
      obs: `Gerado a partir da Cotação ${cot.id}. Vencedor: ${fornecedor?.fantasia || 'Fornecedor'}`,
      recebimentos: []
    };

    // Atualizando o status da SC para "Comprada"
    sc.status = 'Comprada';

    // Adicionando o pedido ao Store
    Store.db.pedidos.unshift(novoPedido);

    // Registrando no histórico da cotação
    cot.historico = cot.historico || [];
    cot.historico.push({
      data: U.today(),
      usuario: Store.user().nome,
      acao: 'Pedido emitido',
      obs: `Emitido Pedido de Compra ${proximoPcId} no valor de ${U.brl(valorProdutos + frete)}`
    });

    // Persistindo
    Store.commit(`Pedido de Compra ${proximoPcId} emitido com sucesso!`, 'success');

    // Se o módulo de pedidos estiver registrado, navega para ele
    if (App.page('pedidos')) {
      App.go('pedidos', { id: proximoPcId });
    }
  }
};

// Renderização detalhada do Mapa de Cotação Comparativo (3 Fornecedores)
Compras.renderMapaDetalhado = function(el, cotId) {
  const cot = Store.cot(cotId);
  if (!cot) {
    el.innerHTML = UI.notice('Cotação não encontrada no sistema.', { icon: 'alert' });
    return;
  }

  const sc = Store.sc(cot.scId);

  // Garantindo que a cotação possua 3 slots de ofertas
  cot.ofertas = cot.ofertas || [];
  while (cot.ofertas.length < 3) {
    cot.ofertas.push({ fornecedorId: '', valor: 0, frete: 0, prazo: 0, pagamento: 'Boleto 28 dias' });
  }

  // Executando cálculo das regras puras de cotação
  const analise = Rules.cotacao(cot);

  // Se nenhuma oferta estiver selecionada, assume a menor válida
  if (cot.escolhida == null || cot.escolhida < 0) {
    cot.escolhida = analise.menorIdx >= 0 ? analise.menorIdx : 0;
  }

  // Alçada exigida calculada com base no valor total da oferta escolhida
  const totalEscolhido = analise.escolhido;
  const alcadaExigida = Rules.alcada(totalEscolhido);

  // Fornecedores ativos disponíveis para cotação
  const fornecedoresAtivos = (Store.db.fornecedores || []).filter(f => f.status === 'Ativo');

  // Modo somente leitura se a cotação já estiver Aprovada
  const isConcluida = ['Aprovada'].includes(cot.status);

  // Montando as 3 colunas de ofertas comparativas
  const colunasOfertasHtml = [0, 1, 2].map(idx => {
    const oferta = cot.ofertas[idx] || { fornecedorId: '', valor: 0, frete: 0, prazo: 0, pagamento: 'Boleto 28 dias' };
    const valorUnit = Number(oferta.valor) || 0;
    const frete = Number(oferta.frete) || 0;
    const qtd = Number(sc?.qtd) || 0;
    const totalOferta = valorUnit > 0 ? (valorUnit * qtd + frete) : 0;
    const isMenor = analise.menorIdx === idx && analise.validas > 0;
    const isEscolhida = Number(cot.escolhida) === idx;

    return `
      <div class="card ${isEscolhida ? 'accent' : ''}" style="display:flex;flex-direction:column;justify-content:space-between">
        <div>
          <div class="row between" style="margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)">
            <span class="label-caps">Proposta 0${idx + 1}</span>
            <div class="row" style="gap:6px">
              ${isMenor ? '<span class="badge badge-success no-dot">⭐ Menor Preço</span>' : ''}
              ${isEscolhida ? '<span class="badge badge-orange no-dot">Vencedora</span>' : ''}
            </div>

/* Module: 02_pedidos.js */
'use strict';
/* =====================================================================
   GHC GESTÃO — MÓDULO 02: PEDIDOS DE COMPRA E ENTREGAS & NF
   ---------------------------------------------------------------------
   Responsabilidade Arquitetural:
   1. Página 'pedidos' (Section: Compras, Order: 4, Icon: cart):
      - Emissão formal de Pedidos de Compra (PC-xxxx) originados de Cotações Aprovadas.
      - Acompanhamento do ciclo de vida: Emissão -> Em Trânsito -> Recebido / Cancelado.
      - Espelho do Pedido corporativo: Ordem de Compra formal para envio ao fornecedor,
        com layout oficial para impressão / PDF, dados fiscais e regras de faturamento.
      - Gestão de cancelamento de pedidos com rastreabilidade de motivo.

   2. Página 'entregas' (Section: Compras, Order: 5, Icon: truck):
      - Monitoramento de prazos logísticos com cálculo real de atraso (sem linhas fantasmas).
      - Registro de recebimentos parciais e totais com lançamento de Nota Fiscal (NF).
      - Integração automática com estoque: incrementa o saldo atual (Store.db.estoque)
        e gera movimentação auditável de 'Entrada' (Store.db.movimentos).
      - Disparo de avaliação rápida de fornecedor pós-entrega (Store.db.avaliacoes).
   ===================================================================== */

const PedidosModule = {
  /* -------------------------------------------------------------------
     Estado Interno das Telas (Filtros, Abas e Busca)
     ------------------------------------------------------------------- */
  state: {
    pedidos: {
      tab: 'todos',          // 'todos' | 'abertos' | 'parciais' | 'recebidos' | 'cancelados'
      busca: '',
      fornecedorId: '',
      cliente: '',
      status: ''
    },
    entregas: {
      tab: 'todas',          // 'todas' | 'atrasadas' | 'noprazo' | 'recebidas'
      busca: '',
      fornecedorId: '',
      situacao: ''
    }
  },

  /* ===================================================================
     LÓGICA DE DADOS & FILTROS: PEDIDOS DE COMPRA
     =================================================================== */

  // Filtra e retorna a lista de pedidos segundo os critérios ativos
  getPedidosFiltrados() {
    const s = this.state.pedidos;
    return (Store.db.pedidos || []).filter(p => {
      // 1. Filtro por Aba de Status Operacional
      if (s.tab === 'abertos' && (p.status === 'Recebido' || p.status === 'Cancelado')) return false;
      if (s.tab === 'parciais' && p.status !== 'Recebido parcial') return false;
      if (s.tab === 'recebidos' && p.status !== 'Recebido') return false;
      if (s.tab === 'cancelados' && p.status !== 'Cancelado') return false;

      // 2. Filtro por Fornecedor específico
      if (s.fornecedorId && p.fornecedorId !== s.fornecedorId) return false;

      // 3. Filtro por Cliente / Contrato
      if (s.cliente && p.cliente !== s.cliente) return false;

      // 4. Filtro por Status específico
      if (s.status && p.status !== s.status) return false;

      // 5. Busca Textual Ampla (N° Pedido, Fornecedor, Material, Cliente, CC)
      if (s.busca) {
        const fornNome = Store.fornecedorNome(p.fornecedorId);
        const match = U.match(s.busca, p.id, fornNome, p.descricao, p.cliente, p.centroCusto, p.status);
        if (!match) return false;
      }

      return true;
    });
  },

  // Calcula os indicadores chave (KPIs) para a tela de Pedidos
  getKpisPedidos() {
    const list = Store.db.pedidos || [];
    const validos = list.filter(p => p.status !== 'Cancelado');

    const totalPedidos = list.length;
    const totalComprado = U.sum(validos, p => Rules.pedidoTotal(p));
    const emTransito = list.filter(p => p.status === 'Pedido emitido' || p.status === 'Recebido parcial').length;
    const recebidos = list.filter(p => p.status === 'Recebido').length;

    return { totalPedidos, totalComprado, emTransito, recebidos };
  },

  /* ===================================================================
     LÓGICA DE DADOS & FILTROS: ENTREGAS & NOTAS FISCAIS
     =================================================================== */

  // Filtra e retorna as entregas baseando-se nas regras de negócio de prazo
  getEntregasFiltradas() {
    const s = this.state.entregas;
    return (Store.db.pedidos || []).filter(p => {
      // Ignora pedidos cancelados da esteira de entregas
      if (p.status === 'Cancelado') return false;

      const reg = Rules.entrega(p);

      // 1. Filtro por Abas de Prazo
      if (s.tab === 'atrasadas' && !reg.atrasada) return false;
      if (s.tab === 'noprazo' && (reg.atrasada || p.status === 'Recebido')) return false;
      if (s.tab === 'recebidas' && p.status !== 'Recebido') return false;

      // 2. Filtro por Fornecedor
      if (s.fornecedorId && p.fornecedorId !== s.fornecedorId) return false;

      // 3. Filtro por Situação de Prazo
      if (s.situacao && reg.situacao !== s.situacao) return false;

      // 4. Busca Textual (Pedido, Fornecedor, Material, NF, Transportadora)
      if (s.busca) {
        const fornNome = Store.fornecedorNome(p.fornecedorId);
        const nfsStr = (p.recebimentos || []).map(r => r.nf).join(' ');
        const match = U.match(s.busca, p.id, fornNome, p.descricao, p.cliente, p.centroCusto, nfsStr, p.transportadora);
        if (!match) return false;
      }

      return true;
    });
  },

  // Calcula os indicadores chave (KPIs) para a tela de Entregas & NF
  getKpisEntregas() {
    const list = (Store.db.pedidos || []).filter(p => p.status !== 'Cancelado');

    // Entregas no Prazo (em aberto no prazo ou finalizadas no prazo)
    const noPrazo = list.filter(p => !Rules.entrega(p).atrasada).length;

    // Entregas Atrasadas (cálculo real corrigido contra previsão sem linhas fantasmas)
    const atrasadas = list.filter(p => Rules.entrega(p).atrasada).length;

    // Recebimentos Parciais
    const parciais = list.filter(p => p.status === 'Recebido parcial').length;

    // Total de Notas Fiscais Lançadas
    const totalNfs = U.sum(list, p => (p.recebimentos || []).length);
    const totalValorNf = U.sum(list, p => U.sum(p.recebimentos || [], r => r.valorNF || 0));

    return { noPrazo, atrasadas, parciais, totalNfs, totalValorNf };
  },

  /* ===================================================================
     AÇÕES & MODAIS: PEDIDOS DE COMPRA
     =================================================================== */

  /* Abre o modal de emissão de Novo Pedido a partir de uma Cotação Aprovada */
  abrirNovoPedido(preCotId = '') {
    // 1. Busca cotações aprovadas que ainda não geraram pedido
    const cotacoesDisponiveis = (Store.db.cotacoes || []).filter(c => {
      if (c.status !== 'Aprovada') return false;
      const jaTemPedido = Store.db.pedidos.some(p => p.cotId === c.id);
      return !jaTemPedido;
    });

    // Se houver uma cotação pré-selecionada ou a primeira disponível
    const cotIdSelecionada = preCotId || (cotacoesDisponiveis[0]?.id || '');
    const novoId = Store.nextId('PC-', Store.db.pedidos, 'id', 4);

    // Opções para o select de cotações
    let cotOptions = cotacoesDisponiveis.map(c => {
      const sc = Store.sc(c.scId);
      const forn = Store.fornecedorNome(c.ofertas[c.escolhida]?.fornecedorId);
      const total = Rules.cotacao(c).escolhido;
      return {
        value: c.id,
        label: `${c.id} · ${sc ? sc.descricao : 'Item'} (${forn} — ${U.brl(total)})`
      };
    });

    // Se todas as aprovadas já tiverem pedido, oferecemos flexibilidade para aprovar/emitir
    if (!cotOptions.length) {
      cotOptions = [
        { value: '', label: 'Nenhuma cotação aprovada pendente de pedido' },
        ...(Store.db.cotacoes || []).map(c => {
          const sc = Store.sc(c.scId);
          return { value: c.id, label: `${c.id} (${c.status}) · ${sc?.descricao || 'Material'}` };
        })
      ];
    }

    const fornecedoresOpts = (Store.db.fornecedores || []).map(f => ({
      value: f.id,
      label: `${f.fantasia || f.razao} (${f.cnpj})`
    }));

    const pagamentosOpts = Rules.PAGAMENTOS.map(p => ({ value: p, label: p }));
    const unidadesOpts = Rules.UNIDADES.map(u => ({ value: u, label: u }));

    const bodyHtml = `
      <div class="notice info" style="margin-bottom:16px">
        ${Icon('info')}
        <div>
          <b>Governança de Suprimentos GHC:</b> Pedidos de Compra são formalizados a partir de Cotações Aprovadas por alçada. Selecione a cotação aprovada abaixo para carregar automaticamente o fornecedor vencedor, condições e valores negociados.
        </div>
      </div>

      <div class="form-grid cols-2">
        <div class="field full">
          <label for="f_cotId">Cotação Aprovada de Origem <span class="req">*</span></label>
          <select name="cotId" id="f_cotId" onchange="PedidosModule.onSelecionarCotacaoNovoPedido(this.value)">
            <option value="">Selecione uma cotação aprovada...</option>
            ${cotOptions.map(o => `<option value="${U.esc(o.value)}" ${o.value === cotIdSelecionada ? 'selected' : ''}>${U.esc(o.label)}</option>`).join('')}
          </select>
        </div>

        ${UI.field({ name: 'id', label: 'Número do Pedido (PC)', value: novoId, readonly: true })}
        ${UI.field({ name: 'data', label: 'Data de Emissão', type: 'date', value: U.today(), required: true })}

        <div class="form-section">Dados do Fornecedor & Itens Negociados</div>

        <div class="field full">
          <label for="f_fornecedorId">Fornecedor Vencedor <span class="req">*</span></label>
          <select name="fornecedorId" id="f_fornecedorId" required>
            <option value="">Selecione o fornecedor...</option>
            ${fornecedoresOpts.map(o => `<option value="${U.esc(o.value)}">${U.esc(o.label)}</option>`).join('')}
          </select>
        </div>

        ${UI.field({ name: 'descricao', label: 'Descrição do Material / Serviço', full: true, required: true, placeholder: 'Ex: Cabo flexível 2,5mm...' })}
        ${UI.field({ name: 'qtd', label: 'Quantidade', type: 'number', step: 'any', min: '0.01', required: true })}
        
        <div class="field">
          <label for="f_unid">Unidade de Medida <span class="req">*</span></label>
          <select name="unid" id="f_unid" required>
            ${unidadesOpts.map(o => `<option value="${U.esc(o.value)}">${U.esc(o.label)}</option>`).join('')}
          </select>
        </div>

        ${UI.field({ name: 'valorUnit', label: 'Valor Unitário (R$)', type: 'number', step: '0.01', min: '0', required: true })}
        ${UI.field({ name: 'frete', label: 'Valor do Frete (R$)', type: 'number', step: '0.01', min: '0', value: '0.00' })}

        <div class="form-section">Faturamento, Logística & Destino</div>

        ${UI.field({ name: 'cliente', label: 'Cliente / Projeto Destino', required: true, placeholder: 'Ex: Mercado Livre RC01' })}
        ${UI.field({ name: 'centroCusto', label: 'Centro de Custo', required: true, placeholder: 'Ex: Meli RC01' })}
        ${UI.field({ name: 'localEntrega', label: 'Endereço / Local de Entrega', full: true, required: true, placeholder: 'Ex: Docas 3 e 4 - Perus/SP' })}
        
        <div class="field">
          <label for="f_pagamento">Condição de Pagamento <span class="req">*</span></label>
          <select name="pagamento" id="f_pagamento" required>
            ${pagamentosOpts.map(o => `<option value="${U.esc(o.value)}">${U.esc(o.label)}</option>`).join('')}
          </select>
        </div>

        ${UI.field({ name: 'previsao', label: 'Previsão de Entrega Prometida', type: 'date', required: true })}
        ${UI.field({ name: 'transportadora', label: 'Transportadora / Frete', placeholder: 'Ex: Própria do Fornecedor / Braspress' })}
        ${UI.field({ name: 'responsavelRecebimento', label: 'Responsável no Recebimento', placeholder: 'Ex: Almoxarifado Central / Carlos Mendes' })}
        ${UI.field({ name: 'obs', label: 'Observações do Pedido', type: 'textarea', full: true, placeholder: 'Instruções especiais de entrega, faturamento ou contato com portaria...' })}
        <input type="hidden" name="scId" id="f_scId" value="">
      </div>
    `;

    UI.modal({
      title: 'Novo Pedido de Compra (PC)',
      sub: 'Geração e emissão de ordem de fornecimento com bloqueio de governança',
      body: bodyHtml,
      size: 'lg',
      submitLabel: 'Emitir Pedido de Compra',
      onOpen: (form) => {
        // Se houver cotação inicial, preenche os campos automaticamente
        if (cotIdSelecionada) {
          PedidosModule.preencherCamposPorCotacao(form, cotIdSelecionada);
        }
      },
      onSubmit: (values, form, close) => {
        // Validação de segurança
        const qtd = Number(values.qtd) || 0;
        const vUnit = U.parseNum(values.valorUnit);
        const frete = U.parseNum(values.frete);

        if (qtd <= 0 || vUnit <= 0) {
          UI.toast('Informe quantidade e valor unitário válidos.', 'error');
          return false;
        }

        const vProd = qtd * vUnit;
        const compradora = Store.user()?.nome || 'Juliana Silva';

        // Cria o registro canônico do Pedido de Compra
        const novoPedido = {
          id: values.id || Store.nextId('PC-', Store.db.pedidos, 'id', 4),
          scId: values.scId || null,
          cotId: values.cotId || null,
          data: values.data || U.today(),
          compradora,
          fornecedorId: values.fornecedorId,
          cliente: values.cliente,
          centroCusto: values.centroCusto,
          descricao: values.descricao,
          qtd,
          unid: values.unid,
          valorUnit: vUnit,
          valorProdutos: vProd,
          frete,
          status: 'Pedido emitido',
          previsao: values.previsao,
          pagamento: values.pagamento,
          localEntrega: values.localEntrega,
          responsavelRecebimento: values.responsavelRecebimento || 'Almoxarifado',
          transportadora: values.transportadora || 'A definir',
          obs: values.obs || '',
          recebimentos: []
        };

        // Adiciona à base em memória
        Store.db.pedidos = Store.db.pedidos || [];
        Store.db.pedidos.unshift(novoPedido);

        // Atualiza a SC vinculada se existir
        if (novoPedido.scId) {
          const sc = Store.sc(novoPedido.scId);
          if (sc && sc.status !== 'Comprada') {
            sc.status = 'Comprada';
          }
        }

        // Atualiza a Cotação se existir
        if (novoPedido.cotId) {
          const cot = Store.cot(novoPedido.cotId);
          if (cot && cot.status !== 'Aprovada') {
            cot.status = 'Aprovada';
          }
        }

        // Persiste e notifica
        Store.commit(`Pedido de Compra ${novoPedido.id} emitido com sucesso!`, 'success');
        close();

        // Oferece abertura imediata do Espelho formal do Pedido
        setTimeout(() => {
          PedidosModule.abrirEspelho(novoPedido.id);
        }, 250);

        return true;
      }
    });
  },

  // Evento disparado no formulário ao trocar a cotação selecionada
  onSelecionarCotacaoNovoPedido(cotId) {
    const form = document.querySelector('.modal form');
    if (!form || !cotId) return;
    this.preencherCamposPorCotacao(form, cotId);
  },

  // Auto-completa campos da cotação no formulário de emissão
  preencherCamposPorCotacao(form, cotId) {
    const cot = Store.cot(cotId);
    if (!cot) return;

    const sc = Store.sc(cot.scId);
    const oferta = cot.ofertas && cot.ofertas[cot.escolhida != null ? cot.escolhida : 0];

    if (oferta) {
      if (form.fornecedorId) form.fornecedorId.value = oferta.fornecedorId || '';
      if (form.valorUnit) form.valorUnit.value = Number(oferta.valor || 0).toFixed(2);
      if (form.frete) form.frete.value = Number(oferta.frete || 0).toFixed(2);
      if (form.pagamento) form.pagamento.value = oferta.pagamento || 'Boleto 28 dias';
      
      // Previsão baseada no prazo do fornecedor
      const prazoDias = Number(oferta.prazo) || 5;
      if (form.previsao) form.previsao.value = U.addDays(U.today(), prazoDias);
    }

    if (sc) {
      if (form.scId) form.scId.value = sc.id;
      if (form.descricao) form.descricao.value = sc.descricao;
      if (form.qtd) form.qtd.value = sc.qtd;
      if (form.unid) form.unid.value = sc.unid;
      if (form.cliente) form.cliente.value = sc.cliente;
      if (form.centroCusto) form.centroCusto.value = sc.centroCusto;
      if (form.localEntrega) form.localEntrega.value = sc.localEntrega || 'Almoxarifado Central';
      if (form.responsavelRecebimento) form.responsavelRecebimento.value = sc.solicitante || '';
    }

  /* ===================================================================

  // Cancela o pedido com confirmação prévia e registro do motivo
  cancelarPedido(pedidoId) {
    const p = Store.pedido(pedidoId);
    if (!p) return;

    if (p.status === 'Cancelado') {
      UI.toast('Este pedido já está cancelado.', 'warning');
      return;
    }

    if (p.status === 'Recebido') {
      UI.toast('Não é possível cancelar um pedido já recebido 100%.', 'error');
      return;
    }

    const bodyHtml = `
      <div class="notice" style="margin-bottom:14px">
        ${Icon('alert')}
        <div>
          Você está prestes a cancelar o pedido <b>${p.id}</b> (${Store.fornecedorNome(p.fornecedorId)} - ${U.brl(Rules.pedidoTotal(p))}). 
          Se houver recebimentos parciais, eles permanecerão no histórico, mas nenhuma entrega adicional poderá ser lançada.
        </div>
      </div>
      <div class="field full">
        <label for="f_motivo">Motivo do Cancelamento <span class="req">*</span></label>
        <textarea name="motivo" id="f_motivo" required placeholder="Ex: Cancelamento solicitado pelo cliente, desacordo comercial de prazo, desistência de compra..."></textarea>
      </div>
    `;

    UI.modal({
      title: `Cancelar Pedido ${p.id}`,
      sub: 'Confirmação e rastreabilidade de governança',
      body: bodyHtml,
      submitLabel: 'Confirmar Cancelamento',
      onSubmit: (values, form, close) => {
        const motivo = (values.motivo || '').trim();
        if (!motivo) {
          UI.toast('Informe o motivo do cancelamento.', 'error');
          return false;
        }

        p.status = 'Cancelado';
        p.motivoCancelamento = motivo;

        Store.commit(`Pedido ${p.id} cancelado com sucesso.`, 'warning');
        close();
        return true;
      }
    });
  },

  /* ===================================================================
     REGISTRO DE RECEBIMENTO & INTEGRAÇÃO DE ESTOQUE (ENTREGAS & NF)
     =================================================================== */

  // Modal para lançamento de recebimento com conferência física e NF
  abrirRegistrarRecebimento(pedidoId) {
    const p = Store.pedido(pedidoId);
    if (!p) {
      UI.toast('Pedido não encontrado.', 'error');
      return;
    }

    if (p.status === 'Cancelado') {
      UI.toast('Não é possível registrar recebimento em pedido cancelado.', 'error');
      return;
    }

    const totalPedido = Number(p.qtd) || 0;
    const jaRecebido = Rules.qtdRecebida(p);
    const saldoRestante = Math.max(0, totalPedido - jaRecebido);

    if (saldoRestante <= 0) {
      UI.toast('Este pedido já foi 100% recebido.', 'warning');
      return;
    }

    const fornNome = Store.fornecedorNome(p.fornecedorId);
    const userNome = Store.user()?.nome || p.responsavelRecebimento || 'Almoxarifado';

    // Estimativa proporcional do valor da NF (saldo * unitário)
    const valorEstimadoNF = (saldoRestante * Number(p.valorUnit) + (jaRecebido === 0 ? Number(p.frete) : 0)).toFixed(2);

    const bodyHtml = `
      <!-- CARD RESUMO DO PEDIDO -->
      <div style="background:#F8FAFC;border:1px solid #CBD5E1;border-radius:6px;padding:12px;margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #E2E8F0;padding-bottom:6px;margin-bottom:8px">
          <div>
            <b style="font-size:14px;color:#081221">${p.id}</b> · <span style="color:#64748B">${U.esc(fornNome)}</span>
          </div>
          <div>${UI.badge(p.status)}</div>
        </div>
        <div style="font-size:12.5px;color:#334155;line-height:19px">
          <div>Material: <b>${U.esc(p.descricao)}</b></div>
          <div>Cliente / Centro de Custo: <b>${U.esc(p.cliente)}</b> (${U.esc(p.centroCusto)})</div>
          <div style="display:flex;gap:18px;margin-top:6px;font-size:12px;background:#EFF4FF;padding:6px 10px;border-radius:4px">
            <span>Total do Pedido: <b>${U.num(totalPedido)} ${U.esc(p.unid)}</b></span>
            <span>Já Recebido: <b style="color:#047857">${U.num(jaRecebido)} ${U.esc(p.unid)}</b></span>
            <span>Saldo a Receber: <b style="color:#E25C1D">${U.num(saldoRestante)} ${U.esc(p.unid)}</b></span>
          </div>
        </div>
      </div>

      <!-- FORMULÁRIO DE CONFERÊNCIA FISCAL -->
      <div class="form-grid cols-2">
        ${UI.field({ name: 'data', label: 'Data do Recebimento', type: 'date', value: U.today(), required: true })}
        ${UI.field({ name: 'qtd', label: `Qtd Recebida nesta remessa (${p.unid})`, type: 'number', step: 'any', min: '0.01', max: String(saldoRestante), value: String(saldoRestante), required: true, hint: `Máximo disponível: ${U.num(saldoRestante)} ${p.unid}` })}

        ${UI.field({ name: 'nf', label: 'Número da Nota Fiscal (NF-e)', required: true, placeholder: 'Ex: NF-12490' })}
        ${UI.field({ name: 'valorNF', label: 'Valor Total da NF (R$)', type: 'number', step: '0.01', min: '0.01', value: valorEstimadoNF, required: true })}

        ${UI.field({ name: 'responsavel', label: 'Responsável pela Conferência', value: userNome, required: true })}
        ${UI.field({ name: 'transportadora', label: 'Transportadora / Rastreio', value: p.transportadora || '', placeholder: 'Ex: Braspress / Motoboy' })}

        ${UI.field({ name: 'obs', label: 'Observações da Entrega', type: 'textarea', full: true, placeholder: 'Estado da embalagem, laudos técnicos anexos, condições físicas do material...' })}
      </div>
    `;

    UI.modal({
      title: `Registrar Recebimento & NF — ${p.id}`,
      sub: 'Conferência física com atualização instantânea de saldo em estoque',
      body: bodyHtml,
      size: 'md',
      submitLabel: 'Confirmar Entrada & Atualizar Estoque',
      onSubmit: (values, form, close) => {
        const qtdInformada = Number(values.qtd) || 0;
        const nfNum = (values.nf || '').trim();
        const vNF = U.parseNum(values.valorNF);
        const responsavel = (values.responsavel || userNome).trim();
        const dataRec = values.data || U.today();

        if (qtdInformada <= 0) {
          UI.toast('Informe uma quantidade válida para recebimento.', 'error');
          return false;
        }

        if (qtdInformada > saldoRestante + 0.0001) {
          UI.toast(`A quantidade não pode exceder o saldo pendente de ${U.num(saldoRestante)} ${p.unid}.`, 'error');
          return false;
        }

        if (!nfNum) {
          UI.toast('O número da Nota Fiscal é obrigatório.', 'error');
          return false;
        }

        // 1. Cria o objeto canônico de recebimento
        const novoRecebimento = {
          data: dataRec,
          qtd: qtdInformada,
          nf: nfNum,
          valorNF: vNF,
          responsavel,
          transportadora: (values.transportadora || '').trim(),
          obs: (values.obs || '').trim()
        };

        p.recebimentos = p.recebimentos || [];
        p.recebimentos.push(novoRecebimento);

        // 2. Atualiza os status do Pedido e da Solicitação (SC)
        const totalRecebidoApos = Rules.qtdRecebida(p);
        if (totalRecebidoApos >= totalPedido) {
          p.status = 'Recebido';
          // Se 100% recebido, atualiza a SC para Comprada
          if (p.scId) {
            const sc = Store.sc(p.scId);
            if (sc) sc.status = 'Comprada';
          }
        } else {
          p.status = 'Recebido parcial';
        }

        // 3. INTEGRAÇÃO AUTOMÁTICA COM O ESTOQUE
        let itemEstoque = null;

        // Tenta localizar por código direto (se SC ou Pedido tiverem itemCodigo)
        if (p.itemCodigo) {
          itemEstoque = Store.item(p.itemCodigo);
        } else if (p.scId) {
          const sc = Store.sc(p.scId);
          if (sc?.itemCodigo) itemEstoque = Store.item(sc.itemCodigo);
        }

        // Se não localizou por código, faz busca fuzzy por descrição/nome
        if (!itemEstoque) {
          itemEstoque = (Store.db.estoque || []).find(it => U.norm(it.material) === U.norm(p.descricao))
                     || (Store.db.estoque || []).find(it => U.norm(it.material).includes(U.norm(p.descricao)) || U.norm(p.descricao).includes(U.norm(it.material)));
        }

        // Se localizou item em estoque, incrementa saldo e gera movimentação
        if (itemEstoque) {
          itemEstoque.atual = (Number(itemEstoque.atual) || 0) + qtdInformada;
          if (p.valorUnit) itemEstoque.ultimoPreco = Number(p.valorUnit);

          Store.db.movimentos = Store.db.movimentos || [];
          const movId = Store.nextId('MOV-', Store.db.movimentos, 'id', 4);
          Store.db.movimentos.unshift({
            id: movId,
            data: dataRec,
            codigo: itemEstoque.codigo,
            tipo: 'Entrada',
            qtd: qtdInformada,
            ref: p.id,
            responsavel,
            obs: `Recebimento ${p.id} - ${nfNum}`
          });
        }

        // 4. Salva a mutação no banco de dados e notifica
        Store.save();
        App.rerender();
        UI.toast(`Recebimento da ${nfNum} registrado com sucesso! Estoque atualizado (+${U.num(qtdInformada)} ${p.unid}).`, 'success');
        close();

        // 5. Oferece avaliação rápida de desempenho do fornecedor
        setTimeout(() => {
          PedidosModule.conviteAvaliacaoRapida(p, novoRecebimento);
        }, 300);

        return true;
      }
    });
  },

    const reg = Rules.entrega(p);

    // Sugestão de nota de prazo baseada na pontualidade real
    const sugestaoPrazo = reg.atrasada ? (reg.dias > 5 ? 5 : 7) : 10;

    const bodyHtml = `
      <div style="background:#F8FAFC;border:1px solid #CBD5E1;border-radius:6px;padding:12px;margin-bottom:16px;font-size:13px">
        Fornecedor: <b>${U.esc(fornNome)}</b> · Pedido: <b>${p.id}</b> (${U.esc(p.descricao)})<br>
        Situação da Entrega: ${UI.badge(reg.situacao)}
      </div>

      <div class="form-grid cols-2">
        <div class="field">
          <label for="f_preco">1. Preço e Condições (0 a 10) <span class="req">*</span></label>
          <input type="number" name="preco" id="f_preco" min="0" max="10" step="0.5" value="10" required>
          <span class="hint">Fidelidade aos valores cotados e frete</span>
        </div>

        <div class="field">
          <label for="f_prazo">2. Prazo de Entrega (0 a 10) <span class="req">*</span></label>
          <input type="number" name="prazo" id="f_prazo" min="0" max="10" step="0.5" value="${sugestaoPrazo}" required>
          <span class="hint">Cumprimento da data combinada</span>
        </div>

        <div class="field">
          <label for="f_qualidade">3. Qualidade do Material (0 a 10) <span class="req">*</span></label>
          <input type="number" name="qualidade" id="f_qualidade" min="0" max="10" step="0.5" value="10" required>
          <span class="hint">Embalagem, especificações e sem avarias</span>
        </div>

        <div class="field">
          <label for="f_atendimento">4. Atendimento Comercial (0 a 10) <span class="req">*</span></label>
          <input type="number" name="atendimento" id="f_atendimento" min="0" max="10" step="0.5" value="9" required>
          <span class="hint">Agilidade na cotação e suporte de envio</span>
        </div>

        <div class="field full">
          <label for="f_documentacao">5. Documentação & NF-e (0 a 10) <span class="req">*</span></label>
          <input type="number" name="documentacao" id="f_documentacao" min="0" max="10" step="0.5" value="10" required>
          <span class="hint">Envio prévio de XML, laudos e correções fiscais</span>
        </div>

        <div class="field full">
          <label for="f_comentarios">Comentários e Justificativa da Avaliação</label>
          <textarea name="comentarios" id="f_comentarios" placeholder="Ex: Material entregue em conformidade com as especificações da engenharia..."></textarea>
        </div>
      </div>
    `;

    UI.modal({
      title: `Avaliação de Fornecedor — ${fornNome}`,
      sub: 'Métricas de desempenho para qualificação e histórico homologado',
      body: bodyHtml,
      size: 'md',
      submitLabel: 'Salvar Avaliação de Desempenho',
      onSubmit: (values, form, close) => {
        const preco = Number(values.preco) || 0;
        const prazo = Number(values.prazo) || 0;
        const qualidade = Number(values.qualidade) || 0;
        const atendimento = Number(values.atendimento) || 0;
        const documentacao = Number(values.documentacao) || 0;

        Store.db.avaliacoes = Store.db.avaliacoes || [];
        const avId = Store.nextId('AV-', Store.db.avaliacoes, 'id', 4);

        Store.db.avaliacoes.unshift({
          id: avId,
          data: U.today(),
          fornecedorId: p.fornecedorId,
          pedidoId: p.id,
          preco,
          prazo,
          qualidade,
          atendimento,
          documentacao,
          responsavel: Store.user()?.nome || 'Juliana Silva',
          comentarios: (values.comentarios || '').trim() || 'Avaliação registrada após recebimento fiscal.'
        });

        Store.commit(`Avaliação ${avId} gravada com sucesso! Score do fornecedor atualizado.`, 'success');
        close();
        return true;
      }
    });

          render: (p) => `
            <div>
              <a href="javascript:void(0)" onclick="PedidosModule.abrirEspelho('${p.id}')" style="font-weight:700;color:var(--orange);text-decoration:none">

            return `
              <div>
                <div class="cell-main">${U.esc(f ? (f.fantasia || f.razao) : '—')}</div>
                <div class="cell-sub">${U.esc(f?.telefone || f?.contato || '—')}</div>
              </div>
            `;

        {
          label: 'Cliente / Projeto',
          render: (p) => `
            <div>
              <div class="cell-main">${U.esc(p.cliente)}</div>
              <div class="cell-sub">${U.esc(p.centroCusto)}</div>
            </div>
          `
        },
        {
          label: 'Item / Material',
          render: (p) => `
            <div style="max-width:220px" title="${U.esc(p.descricao)}">
              <div class="cell-main" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${U.esc(p.descricao)}</div>
              <div class="cell-sub">${U.esc(p.localEntrega || 'Almoxarifado Central')}</div>
            </div>
          `
        },
        {
          label: 'Qtd Pedida',
          align: 'right',
          render: (p) => `<b>${U.num(p.qtd)}</b> <span class="muted small">${U.esc(p.unid)}</span>`
        },
        {
          label: 'Progresso Recebimento',
          render: (p) => {
            const rec = Rules.qtdRecebida(p);
            const total = Number(p.qtd) || 1;
            const frac = Math.min(1, rec / total);
            const pct = Math.round(frac * 100);
            const tone = frac >= 1 ? 'ok' : frac > 0 ? 'warn' : '';

            return `
              <div style="min-width:130px">
                <div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:3px">
                  <b>${U.num(rec)} ${U.esc(p.unid)}</b>
                  <span class="muted">${pct}%</span>
                </div>
                ${UI.progress(frac, tone)}
              </div>
            `;
          }
        },
        {
          label: 'Previsão Entrega',
          render: (p) => `<div>${U.date(p.previsao)}</div>`
        },
        {
          label: 'Situação do Prazo',
          render: (p) => {
            const reg = Rules.entrega(p);
            let texto = reg.situacao;

            // Enriquecimento do badge com quantidade exata de dias
            if (reg.dias > 0) {
              texto += ` (${reg.dias}d)`;
            } else if (reg.faltam != null && reg.faltam > 0 && reg.aberta) {
              texto += ` (em ${reg.faltam}d)`;
            }

            return UI.badge(texto);
          }
        },
        {
          label: 'Notas Fiscais',
          render: (p) => {
            const recs = p.recebimentos || [];
            if (!recs.length) return '<span class="muted small">Nenhuma NF</span>';

            return `
              <div style="display:flex;flex-direction:column;gap:3px">
                ${recs.map(r => `
                  <span class="chip" style="font-family:monospace;font-size:10.5px" title="Recebido em ${U.date(r.data)} por ${U.esc(r.responsavel)} · ${U.brl(r.valorNF)}">
                    ${U.esc(r.nf)} (${U.num(r.qtd)})
                  </span>
                `).join('')}
              </div>
            `;
          }
        },
        {
          label: 'Transportadora',
          render: (p) => `<div class="cell-sub" style="font-size:12px;color:var(--text-2)">${U.esc(p.transportadora || '—')}</div>`
        },
        {
          label: 'Ações',
          align: 'right',
          render: (p) => {
            const saldo = Math.max(0, (Number(p.qtd) || 0) - Rules.qtdRecebida(p));
            const temRecs = (p.recebimentos || []).length > 0;

            return `
              <div class="row" style="justify-content:flex-end;gap:6px">
                ${saldo > 0 ? `
                  <button type="button" class="btn btn-primary btn-xs" onclick="PedidosModule.abrirRegistrarRecebimento('${p.id}')">

                ` : ''}
                <button type="button" class="btn btn-ghost btn-xs" onclick="PedidosModule.abrirEspelho('${p.id}')" title="Ver Espelho do Pedido">
                  ${Icon('eye')}
                </button>
              </div>
            `;
          }
        }
      ],
      rows: entregas,
      empty: 'Nenhuma entrega encontrada com os filtros selecionados.'

    const abertos = (Store.db.pedidos || []).filter(p => p.status !== 'Recebido' && p.status !== 'Cancelado').length;
    return abertos > 0 ? abertos : null;
  },
  render(el, params) {
    PedidosModule.renderPedidos(el, params);
  }
});

/* Module: 03_fornecedores_estoque.js */
'use strict';
/* =====================================================================
   GHC GESTÃO — MÓDULO 03: FORNECEDORES, AVALIAÇÕES E ESTOQUE DINÂMICO
   ---------------------------------------------------------------------
   Este módulo implementa a gestão estratégica da cadeia de suprimentos:
   1. Cadastro Homologado de Fornecedores e Ficha Cadastral 360°
   2. Avaliação de Desempenho (SLA de Preço, Prazo, Qualidade, SAC, Docs)
   3. Controle de Estoque com Reposição Dinâmica e Ponto de Pedido (ROP)
   
   Contratos consumidos do core.js:
   - U (utilitários de moeda, formatação, data e busca)
   - Icon (biblioteca vetorial SVG estilo Lucide)
   - Store (repositório centralizado, persistência e commit)
   - Rules (motor de regras puras: alçadas, estoque, SLA de fornecedores)
   - UI (componentes de design system: badges, KPIs, tabelas, modais, toasts)
   - App (registro de páginas no ciclo de vida do ERP)
   ===================================================================== */

    avaliacoes: {
      busca: '',
      fornecedorId: '',

    estoque: {
      busca: '',
      categoria: '',
      aba: 'todos', // 'todos' | 'comprar' | 'critico' | 'normais'

    movimentos: {
      busca: '',
      tipo: '',
    },
  },

  /* ===================================================================
     1. PÁGINA: FORNECEDORES (CADASTROS)
     =================================================================== */

  // Renderizador principal da página de Fornecedores
  renderFornecedores(el, params) {
    // Calculando métricas de alto nível para os cards de KPI
    const total = Store.db.fornecedores.length;
    const ativos = Store.db.fornecedores.filter(f => f.status === 'Ativo').length;
    const categoriasUnicas = new Set(Store.db.fornecedores.map(f => f.categoria)).size;
    
    // Média geral da base considerando todos os fornecedores avaliados
    const fornecedoresComNota = Store.db.fornecedores
      .map(f => Rules.notaFornecedor(f.id).nota)
      .filter(n => n !== null);
    const mediaGeral = fornecedoresComNota.length
      ? U.num(U.sum(fornecedoresComNota, x => x) / fornecedoresComNota.length, 1)
      : '—';

    // Montando a estrutura visual da página
    el.innerHTML = `
      ${UI.pageHead({
        eyebrow: 'Cadastros Estratégicos',
        title: 'Gestão de Fornecedores',
        sub: 'Homologação, histórico contratual, condições comerciais e indicador unificado de desempenho (SLA).',

          icon: 'plus',
          variant: 'primary',
          onclick: 'ModFornecedoresEstoque.modalNovoFornecedor()',

        }),
      })}

      <!-- KPIs Estratégicos de Fornecedores -->
      <div class="kpis">
        ${UI.kpi({ label: 'Total de Fornecedores', value: total, note: 'Empresas cadastradas', icon: 'building', tone: 'dark' })}
        ${UI.kpi({ label: 'Fornecedores Ativos', value: ativos, note: `${total - ativos} inativos ou em homologação`, icon: 'checkCircle', tone: 'light' })}
        ${UI.kpi({ label: 'Categorias Atendidas', value: categoriasUnicas, note: 'Segmentos de materiais e serviços', icon: 'layers', tone: 'light' })}
        ${UI.kpi({ label: 'Nota Média da Base', value: mediaGeral, note: 'Avaliação de entregas e SLA', icon: 'star', tone: 'light' })}
      </div>

      <!-- Card principal com toolbar e listagem -->
      <div class="card flush">
        <div class="toolbar">
          <div class="search">
            ${Icon('search')}
            <input
              type="text"
              id="buscaFornecedorInput"
              placeholder="Buscar por razão social, nome fantasia, CNPJ, contato ou cidade..."
              value="${U.esc(this.state.fornecedores.busca)}"
              oninput="ModFornecedoresEstoque.onBuscaFornecedor(this.value)"
            />
          </div>
          <select id="filtroFornecedorCategoria" onchange="ModFornecedoresEstoque.onFiltroFornecedorCategoria(this.value)">
            <option value="">Todas as categorias</option>
            ${Rules.CATEGORIAS.map(cat => `<option value="${cat}" ${this.state.fornecedores.categoria === cat ? 'selected' : ''}>${cat}</option>`).join('')}
          </select>
          <select id="filtroFornecedorStatus" onchange="ModFornecedoresEstoque.onFiltroFornecedorStatus(this.value)">
            <option value="">Todos os status</option>
            ${Rules.STATUS_FORNECEDOR.map(st => `<option value="${st}" ${this.state.fornecedores.status === st ? 'selected' : ''}>${st}</option>`).join('')}
          </select>
        </div>

        <div id="fornecedoresTabelaContainer"></div>
      </div>
    `;

    // Desenha a tabela com os filtros atuais
    this.renderTabelaFornecedores();

    // Se veio parâmetro para abrir ficha específica (ex: App.go('fornecedores', { id: 'G01' }))
    if (params && params.id) {
      setTimeout(() => this.modalFichaFornecedor(params.id), 50);
    }
  },

  // Atualiza apenas a tabela de fornecedores preservando o foco do input de busca
  renderTabelaFornecedores() {
    const container = document.getElementById('fornecedoresTabelaContainer');
    if (!container) return;

    const { busca, categoria, status } = this.state.fornecedores;

    // Filtragem dos registros conforme os critérios da toolbar
    const filtrados = Store.db.fornecedores.filter(f => {
      if (categoria && f.categoria !== categoria) return false;
      if (status && f.status !== status) return false;
      if (busca && !U.match(busca, f.id, f.razao, f.fantasia, f.cnpj, f.contato, f.telefone, f.email, f.cidade)) {
        return false;
      }
      return true;
    });

    // Renderizando tabela com o componente padrão UI.table
    container.innerHTML = UI.table({
      columns: [
        {
          label: 'Código',
          width: '90px',
          render: f => `<span class="mono strong c-orange">${U.esc(f.id)}</span>`,
        },
        {
          label: 'Fornecedor',
          render: f => `
            <div class="cell-main">${U.esc(f.fantasia || f.razao)}</div>
            <div class="cell-sub">${U.esc(f.razao)}</div>

        },
        {
          label: 'Categoria',
          render: f => `<span class="chip">${U.esc(f.categoria)}</span>`,
        },
        {
          label: 'CNPJ',
          render: f => `<span class="mono small">${U.esc(f.cnpj)}</span>`,
        },
        {
          label: 'Contato / Fone',
          render: f => `
            <div class="cell-main small">${U.esc(f.contato || '—')}</div>
            <div class="cell-sub">${U.esc(f.telefone || f.email || '—')}</div>
          `,
        },
        {
          label: 'Cidade/UF',
          render: f => `<span class="small">${U.esc(f.cidade || '—')}</span>`,
        },
        {
          label: 'Prazo Médio',
          align: 'center',
          render: f => `<span>${f.prazoMedio ? f.prazoMedio + ' dias' : '—'}</span>`,
        },
        {
          label: 'Nota SLA',
          align: 'center',
          render: f => {
            const inf = Rules.notaFornecedor(f.id);
            return UI.nota(inf.nota);
          },
        },
        {
          label: 'Status',
          render: f => UI.badge(f.status),
        },
        {
          label: 'Ações',
          align: 'right',
          width: '180px',
          render: f => `
            <div class="row" style="justify-content: flex-end; gap: 6px;">
              ${UI.btn('Ficha', {
                icon: 'eye',
                size: 'xs',
                variant: 'ghost',
                onclick: `ModFornecedoresEstoque.modalFichaFornecedor('${f.id}')`,
                title: 'Visualizar ficha técnica e histórico',
              })}
              ${UI.btn('Editar', {
                icon: 'edit',
                size: 'xs',
                variant: 'ghost',
                onclick: `ModFornecedoresEstoque.modalEditarFornecedor('${f.id}')`,
                title: 'Editar dados cadastrais',
              })}
            </div>
          `,
        },
      ],
      rows: filtrados,
      empty: 'Nenhum fornecedor localizado com os filtros selecionados.',
    });
  },

  // Handlers reativos de filtro da tela de fornecedores
  onBuscaFornecedor(val) {
    this.state.fornecedores.busca = val;
    this.renderTabelaFornecedores();
  },

            ${UI.table({
              columns: [
                { label: 'Cotação', width: '95px', render: c => `<span class="mono strong">${U.esc(c.id)}</span>` },
                { label: 'SC Vinculada', width: '95px', render: c => `<span class="mono small">${U.esc(c.scId)}</span>` },

                  label: 'Proposta do Fornecedor',

                  },
                },
                {
                  label: 'Resultado',
                  render: c => {
                    const ofIdx = (c.ofertas || []).findIndex(o => o.fornecedorId === f.id);

                      return `<span class="badge badge-success">${Icon('check')} Proposta Vencedora</span>`;

                    if (c.status === 'Aprovada' && c.escolhida !== ofIdx) {
