/* =====================================================================
   GHC GESTÃO — DESIGN SYSTEM (tokens derivados do DESIGN.md)
   ===================================================================== */
:root {
  /* Marca */
  --orange: #E25C1D;
  --orange-vibrant: #FF6B00;
  --orange-deep: #C2410C;
  --orange-tint: rgba(226, 92, 29, 0.10);
  --navy: #081221;
  --navy-surface: #0F1E36;
  --slate: #1E293B;
  --blue: #2563EB;
  --blue-tint: rgba(37, 99, 235, 0.10);

  /* Neutros */
  --bg: #F8FAFC;
  --surface: #FFFFFF;
  --chip: #F1F5F9;
  --border: #E2E8F0;
  --border-input: #CBD5E1;
  --text: #0B1C30;
  --text-2: #334155;
  --muted: #64748B;

  /* Status */
  --success: #10B981;
  --success-tint: rgba(16, 185, 129, 0.12);
  --warning: #F59E0B;
  --warning-tint: rgba(245, 158, 11, 0.14);
  --error: #EF4444;
  --error-tint: rgba(239, 68, 68, 0.12);

  /* Elevação */
  --shadow-1: 0px 4px 16px -2px rgba(8, 18, 33, 0.06);
  --shadow-2: 0px 12px 28px -4px rgba(8, 18, 33, 0.12);
  --shadow-3: 0px 24px 48px -12px rgba(8, 18, 33, 0.25);
  --border-card: 1px solid rgba(8, 18, 33, 0.08);

  /* Forma */
  --r-sm: 4px;
  --r-md: 6px;
  --r-lg: 8px;

  --font-head: 'Montserrat', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, sans-serif;
  --sidebar-w: 264px;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 400 14px/20px var(--font-body);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--blue); }
h1, h2, h3, h4 { font-family: var(--font-head); margin: 0; color: var(--text); }
::selection { background: var(--orange-tint); }

/* ---------- Tipografia utilitária ---------- */
.label-caps { font: 700 12px/16px var(--font-head); letter-spacing: .12em; text-transform: uppercase; }
.eyebrow { font: 700 11px/16px var(--font-head); letter-spacing: .14em; text-transform: uppercase; color: var(--orange); }
.muted { color: var(--muted); }
.small { font-size: 12px; line-height: 16px; }
.mono { font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; font-size: 12px; }
.strong { font-weight: 600; }
.t-right { text-align: right; }
.t-center { text-align: center; }
.nowrap { white-space: nowrap; }
.c-orange { color: var(--orange); }
.c-success { color: var(--success); }
.c-error { color: var(--error); }
.c-warning { color: #B45309; }

/* ---------- Layout ---------- */
.app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: 100vh; }

.sidebar {
  background: var(--navy);
  color: #CBD5E1;
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  border-right: 1px solid var(--slate);
}
.sidebar-brand { padding: 20px 18px 16px; border-bottom: 1px solid var(--slate); }
.brand-logo {
  height: 52px;
  display: flex; align-items: center; justify-content: flex-start;
}
.brand-logo img {
  max-width: 100%; height: 100%; width: auto;
  object-fit: contain; object-position: left center;
}
.brand-sub { margin-top: 10px; display: flex; justify-content: space-between; align-items: center; font: 700 10px/14px var(--font-head); letter-spacing: .16em; color: #94A3B8; text-transform: uppercase; }
.brand-sub b { color: var(--orange); font-weight: 800; }

.nav { padding: 14px 12px; display: flex; flex-direction: column; gap: 18px; flex: 1; }
.nav-group-label { font: 700 10px/14px var(--font-head); letter-spacing: .16em; color: #64748B; text-transform: uppercase; padding: 0 10px 6px; }
.nav-item {
  width: 100%; display: flex; align-items: center; gap: 11px;
  padding: 9px 10px; border: 0; background: transparent; color: #CBD5E1;
  border-radius: var(--r-md); text-align: left; font: 500 13.5px/20px var(--font-body);
  position: relative; transition: background .15s, color .15s;
}
.nav-item svg { width: 18px; height: 18px; flex: 0 0 18px; opacity: .85; }
.nav-item:hover { background: var(--navy-surface); color: #fff; }
.nav-item.active { background: var(--navy-surface); color: #fff; font-weight: 600; }
.nav-item.active::before { content: ""; position: absolute; left: -12px; top: 6px; bottom: 6px; width: 3px; border-radius: 0 3px 3px 0; background: var(--orange); }
.nav-item.active svg { color: var(--orange); opacity: 1; }
.nav-item .nav-badge { margin-left: auto; background: var(--orange); color: #fff; font: 700 10px/16px var(--font-head); padding: 0 6px; border-radius: var(--r-sm); min-width: 18px; text-align: center; }
.nav-item .nav-tag { margin-left: auto; font: 700 9px/14px var(--font-head); letter-spacing: .08em; color: #64748B; border: 1px solid var(--slate); padding: 0 5px; border-radius: var(--r-sm); }

.sidebar-foot { padding: 14px 18px 18px; border-top: 1px solid var(--slate); font-size: 11px; line-height: 16px; color: #64748B; }
.sidebar-foot b { color: #CBD5E1; font-weight: 600; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  height: 68px; position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 0 32px; background: rgba(255,255,255,.92); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.crumb { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.crumb strong { color: var(--text); font-weight: 600; }
.topbar-right { display: flex; align-items: center; gap: 12px; }
.live { display: inline-flex; align-items: center; gap: 7px; font: 600 12px/16px var(--font-body); color: #047857; background: var(--success-tint); padding: 4px 9px; border-radius: var(--r-sm); }
.user-switch { display: flex; align-items: center; gap: 10px; padding: 4px 6px 4px 4px; border: 1px solid var(--border); border-radius: var(--r-md); background: #fff; }
.avatar { width: 32px; height: 32px; border-radius: var(--r-md); background: var(--navy); color: #fff; display: grid; place-items: center; font: 700 12px/1 var(--font-head); }
.user-switch select { border: 0; background: transparent; font-weight: 600; font-size: 13px; padding: 4px 2px; outline: none; max-width: 220px; }
.mobile-menu { display: none; }

.view { padding: 28px 32px 48px; width: 100%; max-width: 1440px; margin: 0 auto; }
.footer { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 11px; }

/* ---------- Cabeçalho de página ---------- */
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 24px; flex-wrap: wrap; }
.page-head h1 { font: 700 30px/38px var(--font-head); letter-spacing: -.01em; margin-top: 4px; }
.page-head .sub { color: var(--muted); margin: 6px 0 0; max-width: 720px; font-size: 14px; line-height: 20px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ---------- Botões ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; padding: 0 18px; border-radius: var(--r-md);
  border: 1.5px solid var(--navy); background: transparent; color: var(--navy);
  font: 600 13px/1 var(--font-head); letter-spacing: .01em; white-space: nowrap;
  transition: background .15s, color .15s, transform .15s, box-shadow .15s, border-color .15s;
}
.btn svg { width: 16px; height: 16px; }
.btn:hover { transform: translateY(-1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--orange); border-color: var(--orange); color: #fff; }
.btn-primary:hover { background: var(--orange-deep); border-color: var(--orange-deep); box-shadow: 0 6px 16px -6px rgba(226,92,29,.6); }
.btn-dark { background: var(--navy); color: #fff; }
.btn-dark:hover { background: var(--navy-surface); }
.btn-outline-orange { border-color: var(--orange); color: var(--orange-deep); }
.btn-outline-orange:hover { background: var(--orange-tint); }
.btn-ghost { border-color: transparent; color: var(--text-2); }
.btn-ghost:hover { background: var(--chip); transform: none; }
.btn-danger { border-color: var(--error); color: #B91C1C; }
.btn-danger:hover { background: var(--error-tint); }
.btn-success { background: var(--success); border-color: var(--success); color: #fff; }
.btn-sm { height: 32px; padding: 0 12px; font-size: 12px; }
.btn-xs { height: 26px; padding: 0 9px; font-size: 11px; border-width: 1px; }
.btn-icon { width: 36px; padding: 0; }

/* ---------- Cards ---------- */
.card { background: var(--surface); border: var(--border-card); border-radius: var(--r-lg); box-shadow: var(--shadow-1); padding: 20px; min-width: 0; }
.card.accent { border-top: 2px solid var(--orange); }
.card.flush { padding: 0; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
.card.flush .card-head { padding: 18px 20px 0; }
.card-head h2, .card-title { font: 600 16px/22px var(--font-head); }
.card-head .hint { color: var(--muted); font-size: 12px; margin-top: 2px; }
.card-dark { background: var(--navy); color: #E2E8F0; border: 1px solid var(--slate); }
.card-dark h2 { color: #fff; }

/* ---------- KPIs ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 20px; }
.kpi { border-radius: var(--r-lg); padding: 20px 22px; position: relative; overflow: hidden; min-width: 0; }
.kpi-dark { background: var(--navy); color: #94A3B8; border: 1px solid var(--slate); }
.kpi-light { background: var(--surface); color: var(--muted); border: var(--border-card); box-shadow: var(--shadow-1); }
.kpi-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.kpi-label { font: 700 11px/16px var(--font-head); letter-spacing: .12em; text-transform: uppercase; }
.kpi-icon { width: 34px; height: 34px; border-radius: var(--r-md); display: grid; place-items: center; background: var(--orange-tint); color: var(--orange); }
.kpi-icon svg { width: 18px; height: 18px; }
.kpi-value { font: 700 30px/38px var(--font-head); letter-spacing: -.015em; margin: 12px 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi-dark .kpi-value { color: #fff; }
.kpi-light .kpi-value { color: var(--text); }
.kpi-value .hl { color: var(--orange); }
.kpi-note { font-size: 12px; line-height: 16px; }
.kpi-dark::after { content: ""; position: absolute; right: -30px; top: -30px; width: 110px; height: 110px; border-radius: 50%; background: radial-gradient(circle, rgba(226,92,29,.22), transparent 70%); pointer-events: none; }

/* ---------- Badges / chips ---------- */
.badge { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: var(--r-sm); font: 600 11px/1 var(--font-body); white-space: nowrap; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.no-dot::before { display: none; }
.badge-success { background: var(--success-tint); color: #047857; }
.badge-warning { background: var(--warning-tint); color: #B45309; }
.badge-error { background: var(--error-tint); color: #B91C1C; }
.badge-info { background: var(--blue-tint); color: #1D4ED8; }
.badge-orange { background: var(--orange-tint); color: var(--orange-deep); }
.badge-neutral { background: var(--chip); color: var(--slate); }
.badge-dark { background: var(--navy); color: #fff; }
.chip { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: var(--r-sm); background: var(--chip); color: var(--slate); font-size: 11px; font-weight: 500; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 0 currentColor; animation: pulse 1.8s infinite; display: inline-block; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16,185,129,.55); } 70% { box-shadow: 0 0 0 7px rgba(16,185,129,0); } 100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); } }

/* ---------- Tabelas ---------- */
.table-wrap { overflow-x: auto; }
table.table { width: 100%; border-collapse: collapse; }
.table th { text-align: left; font: 700 10.5px/14px var(--font-head); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--border); background: #FBFCFE; white-space: nowrap; }
.table td { padding: 12px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--text-2); vertical-align: middle; }
.table tbody tr:last-child td { border-bottom: 0; }
.table tbody tr:hover td { background: #FAFBFD; }
.table tr.clickable { cursor: pointer; }
.table .t-right { text-align: right; }
.table .cell-main { font-weight: 600; color: var(--text); }
.table .cell-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.table tfoot td { font-weight: 700; color: var(--text); background: #FBFCFE; border-top: 1px solid var(--border); }
.empty { padding: 36px 20px; text-align: center; color: var(--muted); font-size: 13px; }
.empty svg { width: 28px; height: 28px; color: #94A3B8; display: block; margin: 0 auto 8px; }

/* ---------- Filtros / toolbar ---------- */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.toolbar .search { position: relative; flex: 1; min-width: 220px; }
.toolbar .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); }
.toolbar .search input { padding-left: 36px; }
.input, .toolbar input, .toolbar select, .field input, .field select, .field textarea {
  height: 40px; width: 100%; padding: 0 12px; background: #fff; color: var(--text);
  border: 1px solid var(--border-input); border-radius: var(--r-md); outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.toolbar select { width: auto; min-width: 160px; }
.field textarea { height: auto; min-height: 76px; padding: 10px 12px; resize: vertical; }
.input:focus, .toolbar input:focus, .toolbar select:focus, .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--orange); box-shadow: 0 0 0 1px var(--orange); }
.field input[readonly], .field input:disabled, .field select:disabled { background: var(--chip); color: var(--muted); }

/* ---------- Formulários ---------- */
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
.form-grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.form-grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field > label { font: 700 10.5px/14px var(--font-head); letter-spacing: .1em; text-transform: uppercase; color: var(--text-2); }
.field > label .req { color: var(--orange); }
.field input, .field select { height: 44px; }
.field .hint { font-size: 11.5px; color: var(--muted); }
.form-section { font: 700 11px/16px var(--font-head); letter-spacing: .12em; text-transform: uppercase; color: var(--orange); grid-column: 1 / -1; padding-top: 6px; border-top: 1px dashed var(--border); margin-top: 4px; }
.form-section:first-child { border-top: 0; padding-top: 0; margin-top: 0; }

/* ---------- Modal ---------- */
.modal-backdrop { position: fixed; inset: 0; z-index: 100; background: rgba(8,18,33,.75); backdrop-filter: blur(8px); display: flex; align-items: flex-start; justify-content: center; padding: 48px 16px; overflow-y: auto; animation: fade .15s ease; }
.modal { background: #fff; border-radius: var(--r-lg); box-shadow: var(--shadow-3); width: 100%; max-width: 640px; display: flex; flex-direction: column; animation: rise .2s ease; }
.modal.lg { max-width: 880px; }
.modal.xl { max-width: 1120px; }
.modal-head { padding: 20px 24px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; border-top: 2px solid var(--orange); border-radius: var(--r-lg) var(--r-lg) 0 0; }
.modal-head h3 { font: 700 18px/24px var(--font-head); }
.modal-head .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.modal-body { padding: 20px 24px; }
.modal-foot { padding: 14px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; background: #FBFCFE; border-radius: 0 0 var(--r-lg) var(--r-lg); }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- Toast ---------- */
.toasts { position: fixed; right: 20px; bottom: 20px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast { min-width: 280px; max-width: 420px; background: var(--navy); color: #fff; border-left: 3px solid var(--orange); padding: 12px 16px; border-radius: var(--r-md); box-shadow: var(--shadow-2); font-size: 13px; animation: rise .2s ease; }
.toast.success { border-left-color: var(--success); }
.toast.error { border-left-color: var(--error); }
.toast.warning { border-left-color: var(--warning); }

/* ---------- Grids utilitários ---------- */
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-main { grid-template-columns: minmax(0, 1.6fr) minmax(300px, 1fr); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 10px; align-items: center; }
.row.between { justify-content: space-between; }
.row.wrap { flex-wrap: wrap; }
.mt-16 { margin-top: 16px; } .mt-24 { margin-top: 24px; } .mb-16 { margin-bottom: 16px; }

/* ---------- Abas ---------- */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; overflow-x: auto; }
.tab { border: 0; background: transparent; padding: 10px 14px; font: 600 13px/18px var(--font-head); color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; gap: 8px; align-items: center; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); border-bottom-color: var(--orange); }
.tab .count { background: var(--chip); color: var(--slate); font-size: 11px; padding: 0 6px; border-radius: var(--r-sm); line-height: 18px; }
.tab.active .count { background: var(--orange); color: #fff; }

/* ---------- Barra de progresso / gráficos simples ---------- */
.progress { height: 6px; background: var(--chip); border-radius: 99px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--orange); border-radius: 99px; }
.progress.ok > span { background: var(--success); }
.progress.warn > span { background: var(--warning); }
.progress.bad > span { background: var(--error); }

/* ---------- Notice ---------- */
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--r-lg); background: var(--orange-tint); border: 1px solid rgba(226,92,29,.25); color: var(--slate); font-size: 13px; margin-bottom: 20px; }
.notice svg { width: 18px; height: 18px; color: var(--orange); flex: 0 0 18px; margin-top: 1px; }
.notice.info { background: var(--blue-tint); border-color: rgba(37,99,235,.25); }
.notice.info svg { color: var(--blue); }
.notice.dark { background: var(--navy); border-color: var(--slate); color: #CBD5E1; }

/* ---------- Lista de detalhes ---------- */
.dl { display: grid; grid-template-columns: 160px 1fr; gap: 8px 16px; font-size: 13px; }
.dl dt { color: var(--muted); font-weight: 500; }
.dl dd { margin: 0; color: var(--text); font-weight: 500; }

/* ---------- Timeline ---------- */
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { position: relative; padding: 0 0 14px 22px; font-size: 13px; }
.timeline li::before { content: ""; position: absolute; left: 4px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--orange); }
.timeline li::after { content: ""; position: absolute; left: 7.5px; top: 16px; bottom: 0; width: 1px; background: var(--border); }
.timeline li:last-child::after { display: none; }
.timeline .when { color: var(--muted); font-size: 11.5px; }

/* ---------- Responsivo ---------- */
@media (max-width: 1200px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-main, .grid-3 { grid-template-columns: 1fr; }
}
@media (max-width: 860px) {
  .app { display: block; }
  .sidebar { position: fixed; left: calc(-1 * var(--sidebar-w) - 10px); top: 0; bottom: 0; width: var(--sidebar-w); z-index: 60; transition: left .25s; box-shadow: var(--shadow-3); }
  .sidebar.open { left: 0; }
  .mobile-menu { display: inline-flex; }
  .topbar { padding: 0 16px; }
  .view { padding: 20px 16px 40px; }
  .live, .user-switch .u-meta { display: none; }
  .grid-2, .form-grid, .form-grid.cols-3, .form-grid.cols-4 { grid-template-columns: 1fr; }
  .page-head h1 { font-size: 26px; line-height: 32px; }
  .dl { grid-template-columns: 1fr; }
}
@media (max-width: 520px) {
  .kpis { grid-template-columns: 1fr; }
}
@media print {
  .sidebar, .topbar, .actions, .toolbar { display: none !important; }
  .app { display: block; }
  .card { box-shadow: none; break-inside: avoid; }
}

</style>

<body>
<div class="app">

/* ---------------------------------------------------------------------

const U = {
  // Formata número como moeda brasileira
  brl(n) { return (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); },
  // Moeda abreviada para KPIs (R$ 18,4 mil)
  brlShort(n) {
    n = Number(n) || 0;
    if (Math.abs(n) >= 1e6) return 'R$ ' + (n / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mi';
    if (Math.abs(n) >= 1e4) return 'R$ ' + (n / 1e3).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mil';
    return U.brl(n);
  },
  // Número com casas decimais no padrão pt-BR
  num(n, d = 0) { return (Number(n) || 0).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d }); },
  // Percentual a partir de fração (0.123 -> 12,3%)
  pct(n, d = 1) { return ((Number(n) || 0) * 100).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d }) + '%'; },
  // Data de hoje em ISO local (YYYY-MM-DD)
  today() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); },
  // Soma dias a uma data ISO
  addDays(iso, n) { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); },
  // Diferença em dias (b - a)
  diffDays(a, b) { if (!a || !b) return 0; return Math.round((Date.parse(b + 'T12:00:00') - Date.parse(a + 'T12:00:00')) / 864e5); },
  // ISO -> dd/mm/aaaa
  date(iso) { return iso ? String(iso).slice(0, 10).split('-').reverse().join('/') : '—'; },
  // Chave de mês (YYYY-MM)
  monthKey(iso) { return iso ? String(iso).slice(0, 7) : ''; },
  MONTHS: ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'],
  monthLabel(key) { const [y, m] = key.split('-'); return U.MONTHS[+m - 1] + '/' + y.slice(2); },
  // Escapa HTML (SEMPRE usar ao interpolar texto digitado pelo usuário)
  esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); },
  // Converte "1.234,56" ou "1234.56" em número
  parseNum(v) {
    if (typeof v === 'number') return v;
    if (v == null || v === '') return 0;
    const s = String(v).trim();
    const n = s.includes(',') ? Number(s.replace(/\./g, '').replace(',', '.')) : Number(s);
    return isNaN(n) ? 0 : n;
  },
  // Normaliza texto para busca (sem acento, minúsculo)
  norm(s) { return String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); },
  // Busca textual em vários campos
  match(q, ...fields) { if (!q) return true; const n = U.norm(q); return fields.some(f => U.norm(f).includes(n)); },
  // Soma por função
  sum(arr, fn) { return arr.reduce((a, x) => a + (Number(fn(x)) || 0), 0); },
  // Agrupa em objeto
  groupBy(arr, fn) { return arr.reduce((acc, x) => { const k = fn(x); (acc[k] ||= []).push(x); return acc; }, {}); },
  // Iniciais de um nome
  initials(name) { return String(name || '?').split(' ').filter(Boolean).slice(0, 2).map(p => p[0]).join('').toUpperCase(); },
  // Debounce para buscas
  debounce(fn, ms = 180) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; },
  // Download de arquivo gerado no navegador
  download(filename, content, mime = 'text/plain;charset=utf-8') {
    const blob = content instanceof Blob ? content : new Blob([content], { type: mime });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  },
};

/* ---------------------------------------------------------------------
   Store — banco de dados em memória persistido no localStorage
   ---------------------------------------------------------------------
   Store.db = {
     version, config:{ usuarioId },
     usuarios:     [{ id, nome, perfil, nivel }]                    nivel 0=Compras, 1..3 = alçada
     solicitacoes: [{ id:'SC-0001', data, solicitante, area, cliente, centroCusto, localEntrega,
                      categoria, descricao, especificacao, qtd, unid, prioridade, status,
                      dataNecessidade, obs, itemCodigo? }]
     cotacoes:     [{ id:'COT-0001', scId, data, compradora,
                      ofertas:[{ fornecedorId, valor (UNITÁRIO), frete, prazo (dias), pagamento }] (até 3),
                      escolhida (índice da oferta), justificativa,
                      status:'Em cotação'|'Aguardando aprovação'|'Aprovada'|'Reprovada',
                      nivelRequerido, historico:[{ data, usuario, acao, obs }] }]
     pedidos:      [{ id:'PC-0001', scId, cotId, data, compradora, fornecedorId, cliente, centroCusto,
                      descricao, qtd, unid, valorUnit, valorProdutos, frete, status, previsao, pagamento,
                      localEntrega, responsavelRecebimento, transportadora, obs,
                      recebimentos:[{ data, qtd, nf, valorNF, responsavel }] }]
     fornecedores: [{ id:'G01', razao, fantasia, cnpj, categoria, contato, telefone, email, cidade,
                      status, prazoMedio, pagamento, obs }]
     avaliacoes:   [{ id:'AV-0001', data, fornecedorId, pedidoId, preco, prazo, qualidade, atendimento,
                      documentacao, responsavel, comentarios }]               notas 0..10
     estoque:      [{ codigo:'MAT-001', material, categoria, unid, atual, minimo, maximo,
                      consumoMensal, fornecedorId, ultimoPreco, local, obs }]
     movimentos:   [{ id:'MOV-0001', data, codigo, tipo:'Entrada'|'Saída', qtd, ref, responsavel, obs }]
   }
   Fluxo de mutação: altere Store.db.* e chame Store.commit('mensagem opcional').
   --------------------------------------------------------------------- */
const STORAGE_KEY = 'ghc-gestao-erp-v1';
const Store = {
  db: null,
  // Carrega do navegador ou gera dados de demonstração
  load() {
    let raw = null;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { /* modo privado */ }
    try { this.db = raw ? JSON.parse(raw) : Seed.build(); } catch (e) { this.db = Seed.build(); }
    if (!raw) this.save();
  },
  // Persiste no localStorage
  save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(this.db)); } catch (e) { /* cota/privado */ } },
  // Salva, re-renderiza a página atual e opcionalmente mostra um toast
  commit(msg, type = 'success') { this.save(); App.rerender(); if (msg) UI.toast(msg, type); },
  // Restaura os dados de demonstração
  reset() { this.db = Seed.build(); this.save(); App.rerender(); UI.toast('Dados de demonstração restaurados.', 'success'); },
  // Gera o próximo ID sequencial (SC-0042, PC-0010...)
  nextId(prefix, list, field = 'id', pad = 4) {
    let max = 0;
    for (const x of list) { const m = String(x[field] || '').match(/(\d+)$/); if (m) max = Math.max(max, +m[1]); }
    return prefix + String(max + 1).padStart(pad, '0');
  },
  // Usuário logado (simulado)
  user() { return this.db.usuarios.find(u => u.id === this.db.config.usuarioId) || this.db.usuarios[0]; },
  // Buscas rápidas por ID
  sc(id) { return this.db.solicitacoes.find(x => x.id === id); },
  cot(id) { return this.db.cotacoes.find(x => x.id === id); },
  cotBySc(scId) { return this.db.cotacoes.find(x => x.scId === scId); },
  pedido(id) { return this.db.pedidos.find(x => x.id === id); },
  pedidoByCot(cotId) { return this.db.pedidos.find(x => x.cotId === cotId); },
  pedidoBySc(scId) { return this.db.pedidos.find(x => x.scId === scId); },
  fornecedor(id) { return this.db.fornecedores.find(x => x.id === id); },
  fornecedorNome(id) { const f = this.fornecedor(id); return f ? (f.fantasia || f.razao) : '—'; },
  item(codigo) { return this.db.estoque.find(x => x.codigo === codigo); },
};

/* ---------------------------------------------------------------------
   Rules — regras de negócio PURAS (fórmulas da planilha, corrigidas)
   --------------------------------------------------------------------- */
const Rules = {
  // Listas de domínio (mesmos valores das validações da planilha)
  PRIORIDADES: ['Normal', 'Alta', 'Urgente'],
  STATUS_SC: ['Aberta', 'Em cotação', 'Aguardando aprovação', 'Aprovada', 'Comprada', 'Cancelada'],
  STATUS_COT: ['Em cotação', 'Aguardando aprovação', 'Aprovada', 'Reprovada'],
  STATUS_PEDIDO: ['Aguardando aprovação', 'Aprovado', 'Pedido emitido', 'Recebido parcial', 'Recebido', 'Cancelado'],
  STATUS_FORNECEDOR: ['Ativo', 'Em homologação', 'Bloqueado', 'Inativo'],
  CATEGORIAS: ['Metais', 'Elétrica', 'Hidráulica', 'Pintura', 'EPI', 'Fixadores', 'Ferragens', 'Limpeza', 'Serviços', 'Spot'],
  UNIDADES: ['un', 'm', '6m', 'kg', 'par', 'cento', 'lata', 'galão', 'rolo', 'barra', 'cx', 'serviço'],
  PAGAMENTOS: ['À vista', 'PIX', 'Boleto 14 dias', 'Boleto 28 dias', '28/56 dias', 'Cartão corporativo'],

  // Alçadas de aprovação por valor total da compra
  ALCADAS: [
    { nivel: 1, nome: 'Supervisão', limite: 2000 },
    { nivel: 2, nome: 'Gerência', limite: 10000 },
    { nivel: 3, nome: 'Diretoria', limite: Infinity },
  ],
  // Retorna a alçada exigida para um valor
  alcada(valor) { return this.ALCADAS.find(a => (Number(valor) || 0) <= a.limite); },
  // Usuário pode aprovar? (nível dele >= nível exigido)
  podeAprovar(usuario, cot) { return !!usuario && usuario.nivel >= (cot.nivelRequerido || 1); },

  // Total de uma oferta = valor unitário × qtd + frete (null se oferta vazia)
  ofertaTotal(o, qtd) {
    const v = Number(o?.valor) || 0;
    if (!o || !o.fornecedorId || v <= 0) return null;
    return v * (Number(qtd) || 0) + (Number(o.frete) || 0);
  },
  /* Análise de cotação.
     CORREÇÃO vs planilha: a planilha calculava economia = MAX(0, menor − escolhida),
     que é sempre 0. Aqui economia = maior cotação válida − escolhida (economia negociada). */
  cotacao(cot) {
    const sc = Store.sc(cot.scId);
    const qtd = Number(sc?.qtd) || 0;
    const totais = (cot.ofertas || []).map(o => this.ofertaTotal(o, qtd));
    const validos = totais.map((t, i) => ({ t, i })).filter(x => x.t != null);
    const base = { qtd, totais, validas: validos.length, menor: 0, maior: 0, media: 0, menorIdx: -1, escolhidaIdx: -1, escolhido: 0, economia: 0, economiaPct: 0, diffMenor: 0, precisaJustificativa: false };
    if (!validos.length) return base;
    const menorX = validos.reduce((a, b) => (b.t < a.t ? b : a));
    const maior = Math.max(...validos.map(x => x.t));
    const escolhidaIdx = cot.escolhida != null && totais[cot.escolhida] != null ? Number(cot.escolhida) : menorX.i;
    const escolhido = totais[escolhidaIdx];
    const economia = Math.max(0, maior - escolhido);
    return {
      ...base,
      menor: menorX.t, maior, media: U.sum(validos, x => x.t) / validos.length,
      menorIdx: menorX.i, escolhidaIdx, escolhido,
      economia, economiaPct: maior ? economia / maior : 0,
      diffMenor: escolhido - menorX.t,
      // Justificativa exigida quando há menos de 3 cotações ou quando não se escolhe a menor
      precisaJustificativa: validos.length < 3 || escolhidaIdx !== menorX.i,
    };
  },

  // Valor total do pedido (produtos + frete)
  pedidoTotal(p) { return (Number(p.valorProdutos) || 0) + (Number(p.frete) || 0); },
  // Quantidade já recebida
  qtdRecebida(p) { return U.sum(p.recebimentos || [], r => r.qtd); },
  // Data do último recebimento
  ultimaEntrega(p) { const r = (p.recebimentos || []).map(x => x.data).sort(); return r[r.length - 1] || null; },
  /* Situação de prazo da entrega.
     CORREÇÃO vs planilha: (1) linhas sem previsão não viram "Atrasada";
     (2) entrega feita depois da previsão aparece como "Entregue com atraso". */
  entrega(p, hoje = U.today()) {
    if (p.status === 'Cancelado') return { situacao: 'Cancelada', dias: 0, aberta: false, atrasada: false };
    const rec = this.qtdRecebida(p);
    const completa = Number(p.qtd) > 0 && rec >= Number(p.qtd);
    if (completa || p.status === 'Recebido') {
      const ult = this.ultimaEntrega(p);
      const dias = p.previsao && ult ? U.diffDays(p.previsao, ult) : 0;
      return dias > 0
        ? { situacao: 'Entregue com atraso', dias, aberta: false, atrasada: true, dataEntrega: ult }
        : { situacao: 'Entregue no prazo', dias: 0, aberta: false, atrasada: false, dataEntrega: ult };
    }
    if (p.previsao && p.previsao < hoje) {
      return { situacao: rec > 0 ? 'Parcial em atraso' : 'Atrasada', dias: U.diffDays(p.previsao, hoje), aberta: true, atrasada: true };
    }
    const faltam = p.previsao ? U.diffDays(hoje, p.previsao) : null;
    return { situacao: rec > 0 ? 'Recebido parcial' : 'No prazo', dias: 0, faltam, aberta: true, atrasada: false };
  },

  /* Estoque.
     CORREÇÃO vs planilha: ponto de pedido = mínimo + consumo diário × prazo REAL do fornecedor
     (a planilha usava mínimo + consumo/2, assumindo 15 dias para todos) e itens vazios não geram alerta. */
  estoque(item) {
    const forn = Store.fornecedor(item.fornecedorId);
    const prazo = Number(forn?.prazoMedio) || 7;
    const consumoDia = (Number(item.consumoMensal) || 0) / 30;
    const pontoPedido = Math.ceil((Number(item.minimo) || 0) + consumoDia * prazo);
    const atual = Number(item.atual) || 0;
    const comprar = atual <= pontoPedido;
    const critico = atual < (Number(item.minimo) || 0);
    return {
      prazo, consumoDia, pontoPedido, comprar, critico,
      status: critico ? 'Crítico' : comprar ? 'Comprar' : 'OK',
      sugestao: Math.max(0, Math.ceil((Number(item.maximo) || 0) - atual)),
      valor: atual * (Number(item.ultimoPreco) || 0),
      coberturaDias: consumoDia > 0 ? Math.floor(atual / consumoDia) : null,
      ocupacao: item.maximo ? Math.min(1, atual / item.maximo) : 0,
    };
  },

  // Nota final de uma avaliação (média dos 5 critérios)
  notaAvaliacao(a) {
    const v = [a.preco, a.prazo, a.qualidade, a.atendimento, a.documentacao].map(Number).filter(n => !isNaN(n));
    return v.length ? U.sum(v, x => x) / v.length : 0;
  },
  // Nota média do fornecedor (alimenta o cadastro automaticamente)
  notaFornecedor(fornecedorId) {
    const av = Store.db.avaliacoes.filter(a => a.fornecedorId === fornecedorId);
    if (!av.length) return { nota: null, total: 0, criterios: null };
    const avg = k => U.sum(av, a => a[k]) / av.length;
    return {
      nota: U.sum(av, a => this.notaAvaliacao(a)) / av.length, total: av.length,
      criterios: { preco: avg('preco'), prazo: avg('prazo'), qualidade: avg('qualidade'), atendimento: avg('atendimento'), documentacao: avg('documentacao') },
    };
  },
};

  warning: ['Aguardando aprovação', 'Em cotação', 'Recebido parcial', 'Alta', 'Em homologação', 'Comprar', 'Programada', 'Em trânsito'],
  error: ['Cancelada', 'Cancelado', 'Atrasada', 'Parcial em atraso', 'Entregue com atraso', 'Urgente', 'Crítico', 'Bloqueado', 'Reprovada', 'Saída'],
  info: ['Aberta', 'Pedido emitido'],
  neutral: ['Normal', 'Inativo'],
};
const UI = {
  // Badge colorido automaticamente pelo texto do status (ou variante forçada)
  badge(text, variant) {
    if (!variant) variant = Object.keys(BADGE_MAP).find(k => BADGE_MAP[k].includes(text)) || 'neutral';
    return `<span class="badge badge-${variant}">${U.esc(text)}</span>`;
  },
  // Cabeçalho padrão das páginas
  pageHead({ eyebrow = '', title, sub = '', actions = '' }) {
    return `<div class="page-head"><div>${eyebrow ? `<div class="eyebrow">${eyebrow}</div>` : ''}<h1>${title}</h1>${sub ? `<p class="sub">${sub}</p>` : ''}</div>${actions ? `<div class="actions">${actions}</div>` : ''}</div>`;
  },
  // Botão: UI.btn('Novo', {icon:'plus', variant:'primary', onclick:"Mod.fn()"})
  btn(label, { icon, variant = '', size = '', onclick = '', attrs = '', title = '' } = {}) {
    const cls = ['btn', variant && 'btn-' + variant, size && 'btn-' + size].filter(Boolean).join(' ');
    return `<button type="button" class="${cls}" ${onclick ? `onclick="${onclick}"` : ''} ${title ? `title="${U.esc(title)}"` : ''} ${attrs}>${icon ? Icon(icon) : ''}${label}</button>`;
  },
  // Card KPI (tone 'dark' = navy do DESIGN.md, 'light' = branco)
  kpi({ label, value, note = '', icon = 'chart', tone = 'dark' }) {
    return `<div class="kpi kpi-${tone}"><div class="kpi-top"><span class="kpi-label">${label}</span><span class="kpi-icon">${Icon(icon)}</span></div><div class="kpi-value">${value}</div><div class="kpi-note">${note}</div></div>`;
  },
  /* Tabela: UI.table({ columns:[{label, render:(row)=>html, align:'right', width}], rows,
     empty:'texto', onRow:'Mod.abrir' (recebe row[rowKey]), rowKey:'id', foot: html opcional }) */
  table({ columns, rows, empty = 'Nenhum registro encontrado.', onRow = '', rowKey = 'id', foot = '' }) {
    const head = columns.map(c => `<th class="${c.align === 'right' ? 't-right' : c.align === 'center' ? 't-center' : ''}" ${c.width ? `style="width:${c.width}"` : ''}>${c.label}</th>`).join('');
    const body = rows.length
      ? rows.map(r => `<tr ${onRow ? `class="clickable" onclick="${onRow}('${U.esc(r[rowKey])}')"` : ''}>${columns.map(c => `<td class="${c.align === 'right' ? 't-right' : c.align === 'center' ? 't-center' : ''}">${c.render ? c.render(r) : U.esc(r[c.key])}</td>`).join('')}</tr>`).join('')
      : `<tr><td colspan="${columns.length}"><div class="empty">${Icon('search')}${empty}</div></td></tr>`;
    return `<div class="table-wrap"><table class="table"><thead><tr>${head}</tr></thead><tbody>${body}</tbody>${foot ? `<tfoot>${foot}</tfoot>` : ''}</table></div>`;
  },
  /* Campo de formulário:
     UI.field({ name, label, type:'text'|'number'|'date'|'select'|'textarea'|'email', value, options:[str|{value,label}],
                required, full, placeholder, step, min, max, readonly, hint, attrs }) */
  field({ name, label, type = 'text', value = '', options = [], required = false, full = false, placeholder = '', step, min, max, readonly = false, hint = '', attrs = '' }) {
    const req = required ? 'required' : '';
    const common = `name="${name}" id="f_${name}" ${req} ${readonly ? 'readonly' : ''} ${attrs}`;
    let input;
    if (type === 'select') {
      const opts = options.map(o => {
        const v = typeof o === 'object' ? o.value : o; const l = typeof o === 'object' ? o.label : o;
        return `<option value="${U.esc(v)}" ${String(v) === String(value) ? 'selected' : ''}>${U.esc(l)}</option>`;
      }).join('');
      input = `<select ${common} ${readonly ? 'disabled' : ''}>${placeholder ? `<option value="">${U.esc(placeholder)}</option>` : ''}${opts}</select>`;
    } else if (type === 'textarea') {
      input = `<textarea ${common} placeholder="${U.esc(placeholder)}">${U.esc(value)}</textarea>`;
    } else {
      input = `<input type="${type}" ${common} value="${U.esc(value)}" placeholder="${U.esc(placeholder)}" ${step != null ? `step="${step}"` : ''} ${min != null ? `min="${min}"` : ''} ${max != null ? `max="${max}"` : ''}>`;
    }
    return `<div class="field ${full ? 'full' : ''}"><label for="f_${name}">${label}${required ? ' <span class="req">*</span>' : ''}</label>${input}${hint ? `<span class="hint">${hint}</span>` : ''}</div>`;
  },
  // Lê todos os campos nomeados de um form como objeto (números continuam string — use U.parseNum)
  formValues(form) {
    const out = {};
    form.querySelectorAll('[name]').forEach(el => { out[el.name] = el.type === 'checkbox' ? el.checked : el.value; });
    return out;
  },
  /* Modal com formulário:
     UI.modal({ title, sub, body (html), size:'md'|'lg'|'xl', submitLabel:'Salvar', cancelLabel:'Cancelar',
                hideSubmit:false, extraFoot:'html',
                onOpen:(form)=>{}, onSubmit:(values, form, close)=>{ return false para manter aberto } })
     Retorna { close, form }. */
  modal({ title, sub = '', body = '', size = 'md', submitLabel = 'Salvar', cancelLabel = 'Cancelar', hideSubmit = false, extraFoot = '', onOpen, onSubmit }) {
    const wrap = document.createElement('div');
    wrap.className = 'modal-backdrop';
    wrap.innerHTML = `<form class="modal ${size}" novalidate>
      <div class="modal-head"><div><h3>${title}</h3>${sub ? `<div class="sub">${sub}</div>` : ''}</div>
        <button type="button" class="btn btn-ghost btn-icon btn-sm" data-close aria-label="Fechar">${Icon('x')}</button></div>
      <div class="modal-body">${body}</div>
      <div class="modal-foot">${extraFoot}<button type="button" class="btn btn-ghost" data-close>${cancelLabel}</button>${hideSubmit ? '' : `<button type="submit" class="btn btn-primary">${submitLabel}</button>`}</div>
    </form>`;
    const form = wrap.querySelector('form');
    const close = () => { wrap.remove(); document.removeEventListener('keydown', onKey); };
    const onKey = e => { if (e.key === 'Escape') close(); };
    wrap.addEventListener('mousedown', e => { if (e.target === wrap) close(); });
    wrap.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', close));
    form.addEventListener('submit', e => {
      e.preventDefault();
      // Validação nativa dos campos required
      const invalid = [...form.querySelectorAll('[required]')].find(el => !String(el.value).trim());
      if (invalid) { invalid.focus(); UI.toast('Preencha os campos obrigatórios.', 'error'); return; }
      if (!onSubmit) return close();
      const keep = onSubmit(UI.formValues(form), form, close);
      if (keep !== false) close();
    });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(wrap);
    if (onOpen) onOpen(form);
    const first = form.querySelector('input:not([readonly]):not([type=hidden]), select, textarea');
    if (first) setTimeout(() => first.focus(), 30);
    return { close, form };
  },
  // Confirmação simples
  confirm(message, onYes, { title = 'Confirmar ação', yesLabel = 'Confirmar' } = {}) {
    UI.modal({ title, body: `<p style="margin:0">${message}</p>`, submitLabel: yesLabel, onSubmit: () => { onYes(); } });
  },
  // Toast no canto inferior direito
  toast(msg, type = '') {
    const t = document.createElement('div');
    t.className = 'toast ' + type; t.textContent = msg;
    document.getElementById('toasts').appendChild(t);
    setTimeout(() => t.remove(), 3600);
  },
  // Abas: UI.tabs([{id,label,count}], activeId, "Mod.setTab")
  tabs(items, active, onclick) {
    return `<div class="tabs">${items.map(t => `<button type="button" class="tab ${t.id === active ? 'active' : ''}" onclick="${onclick}('${t.id}')">${t.label}${t.count != null ? `<span class="count">${t.count}</span>` : ''}</button>`).join('')}</div>`;
  },
  // Barra de progresso (0..1) com tom
  progress(frac, tone = '') { return `<div class="progress ${tone}"><span style="width:${Math.max(0, Math.min(100, (Number(frac) || 0) * 100))}%"></span></div>`; },
  // Estrelas/nota 0..10
  nota(n) {
    if (n == null) return '<span class="muted small">Sem avaliação</span>';
    const tone = n >= 8 ? 'badge-success' : n >= 6 ? 'badge-warning' : 'badge-error';
    return `<span class="badge no-dot ${tone}">${Icon('star', 'style="width:12px;height:12px"')} ${U.num(n, 1)}</span>`;
  },
  // Aviso destacado
  notice(html, { icon = 'info', tone = '' } = {}) { return `<div class="notice ${tone}">${Icon(icon)}<div>${html}</div></div>`; },
  // Gráfico de barras verticais em SVG puro: data=[{label, value, value2?}]
  barChart(data, { height = 220, fmt = U.brlShort, color = 'var(--orange)', color2 = 'var(--navy)', legend = null } = {}) {
    if (!data.length) return `<div class="empty">Sem dados no período.</div>`;
    const max = Math.max(1, ...data.map(d => Math.max(d.value || 0, d.value2 || 0)));
    const w = 100 / data.length;
    const bars = data.map((d, i) => {
      const h1 = ((d.value || 0) / max) * (height - 40);
      const h2 = d.value2 != null ? ((d.value2 || 0) / max) * (height - 40) : 0;
      const x = i * w;
      const bw = d.value2 != null ? w * 0.3 : w * 0.55;
      return `<g><title>${U.esc(d.label)}: ${fmt(d.value)}${d.value2 != null ? ' / ' + fmt(d.value2) : ''}</title>
        <rect x="${x + (w - (d.value2 != null ? bw * 2 + w * 0.04 : bw)) / 2}%" y="${height - 22 - h1}" width="${bw}%" height="${h1}" rx="3" fill="${color}"/>
        ${d.value2 != null ? `<rect x="${x + (w - (bw * 2 + w * 0.04)) / 2 + bw + w * 0.04}%" y="${height - 22 - h2}" width="${bw}%" height="${h2}" rx="3" fill="${color2}"/>` : ''}
        <text x="${x + w / 2}%" y="${height - 6}" text-anchor="middle" font-size="11" fill="#64748B" font-family="Inter">${U.esc(d.label)}</text></g>`;
    }).join('');
    const leg = legend ? `<div class="row small muted" style="gap:16px;margin-top:8px">${legend.map((l, i) => `<span class="row" style="gap:6px"><span style="width:10px;height:10px;border-radius:2px;background:${i ? color2 : color}"></span>${l}</span>`).join('')}</div>` : '';
    return `<svg width="100%" height="${height}" role="img"><line x1="0" x2="100%" y1="${height - 22}" y2="${height - 22}" stroke="#E2E8F0"/>${bars}</svg>${leg}`;
  },
};

/* ---------------------------------------------------------------------
   App — registro de páginas, navegação e shell
   ---------------------------------------------------------------------
   App.register({
     id: 'solicitacoes',            // usado na URL (#solicitacoes)
     label: 'Solicitações',         // texto do menu
     icon: 'filePlus',              // chave de ICONS
     section: 'Compras',            // uma de App.SECTIONS
     order: 10,                     // ordem dentro da seção
     badge: () => número | null,    // opcional: contador laranja no menu
     tag: 'Em breve',               // opcional: etiqueta cinza no menu
     render: (el, params) => {}     // desenha a página dentro de el
   })
   App.go('pedidos', { id:'PC-0003' }) navega passando parâmetros.
   App.rerender() redesenha a página atual (Store.commit já chama).
   Dica: para filtros com <input>, re-renderize SÓ a área da tabela para não perder o foco.
   --------------------------------------------------------------------- */
const App = {
  pages: [],
  current: null,
  params: {},
  SECTIONS: ['Visão geral', 'Compras', 'Suprimentos', 'Cadastros', 'Gestão', 'Próximas fases'],
  register(page) { this.pages.push(page); },
  page(id) { return this.pages.find(p => p.id === id); },
  // Inicializa a aplicação
  start() {
    Store.load();
    this.pages.sort((a, b) => (this.SECTIONS.indexOf(a.section) - this.SECTIONS.indexOf(b.section)) || ((a.order || 0) - (b.order || 0)));
    document.getElementById('menuBtn').innerHTML = Icon('menu');
    document.getElementById('menuBtn').onclick = () => document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('resetBtn').innerHTML = Icon('refresh') + '<span>Restaurar demo</span>';
    document.getElementById('resetBtn').onclick = () => UI.confirm('Todos os dados alterados nesta demonstração serão substituídos pelos dados originais. Deseja continuar?', () => Store.reset(), { title: 'Restaurar dados de demonstração', yesLabel: 'Restaurar' });
    const sel = document.getElementById('userSelect');
    sel.onchange = () => { Store.db.config.usuarioId = sel.value; Store.commit('Perfil alterado para ' + Store.user().nome + ' (' + Store.user().perfil + ').', ''); };
    window.addEventListener('hashchange', () => { const id = location.hash.slice(1).split('?')[0]; if (id && id !== this.current && this.page(id)) this.go(id); });
    const initial = location.hash.slice(1).split('?')[0];
    this.go(this.page(initial) ? initial : (this.pages[0]?.id || ''));
  },
  // Navega para uma página
  go(id, params = {}) {
    if (!this.page(id)) return;
    this.current = id; this.params = params;
    if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
    document.getElementById('sidebar').classList.remove('open');
    this.rerender();
    window.scrollTo({ top: 0 });
  },
  // Redesenha menu, topo e página atual
  rerender() {
    this.renderNav();
    this.renderUser();
    const page = this.page(this.current);
    if (!page) return;
    document.getElementById('crumbSection').textContent = page.section;
    document.getElementById('crumbPage').textContent = page.label;
    document.title = page.label + ' | GHC Gestão';
    const el = document.getElementById('view');
    try {
      el.innerHTML = '';
      page.render(el, this.params || {});
      el.insertAdjacentHTML('beforeend', `<div class="footer"><span>GHC Facilities · Gestão integrada de compras e suprimentos</span><span>Desenvolvido por SAOS Technologies · Protótipo com dados fictícios</span></div>`);
    } catch (err) {
      console.error(err);
      el.innerHTML = UI.notice('Erro ao renderizar esta página: ' + U.esc(err.message), { icon: 'alert' });
    }
  },
  renderNav() {
    const groups = this.SECTIONS.map(sec => {
      const items = this.pages.filter(p => p.section === sec);
      if (!items.length) return '';
      return `<div><div class="nav-group-label">${sec}</div>${items.map(p => {
        let b = null; try { b = p.badge ? p.badge() : null; } catch (e) { b = null; }
        return `<button type="button" class="nav-item ${p.id === this.current ? 'active' : ''}" onclick="App.go('${p.id}')">${Icon(p.icon)}<span>${p.label}</span>${b ? `<span class="nav-badge">${b}</span>` : ''}${p.tag ? `<span class="nav-tag">${p.tag}</span>` : ''}</button>`;
      }).join('')}</div>`;
    }).join('');
    document.getElementById('nav').innerHTML = groups;
  },
  renderUser() {
    const u = Store.user();
    document.getElementById('userAvatar').textContent = U.initials(u.nome);
    document.getElementById('userSelect').innerHTML = Store.db.usuarios.map(x => `<option value="${x.id}" ${x.id === u.id ? 'selected' : ''}>${U.esc(x.nome)} · ${U.esc(x.perfil)}</option>`).join('');
  },
};

/* Module: 01_compras.js */
'use strict';
/* =====================================================================
   GHC GESTÃO — MÓDULO 01: COMPRAS, COTAÇÕES E ALÇADAS
   ---------------------------------------------------------------------
   Este módulo implementa o ciclo vital de aquisições de facilities:
   1. Solicitações de Compras (SC): abertura, triagem e controle
   2. Mapa de Cotação Comparativo: equalização de 3 propostas e economia
   3. Central de Aprovação por Alçada: governança e limites financeiros
   
   FLUXO ARQUITETURAL DO MÓDULO:
   // FLUXO DE COMPRAS E APROVAÇÃO POR ALÇADA
   // ENTRADA: Usuário operacional abre Solicitação de Compra (SC)
   // VERIFICAÇÃO: Material existente no catálogo ou avulso
        // MATERIAL CATALOGADO
              // Preenche especificações e sugere reposição de estoque
        // MATERIAL AVULSO
              // Requer detalhamento técnico completo
   // AÇÃO: Compradora inicia Mapa de Cotação Comparativo (3 Fornecedores)
   // CÁLCULO: (Valor Unitário × Quantidade) + Frete
   // COMPARAÇÃO: Identifica menor preço e calcula Economia Negociada
   // VERIFICAÇÃO DE REGRA DE NEGÓCIO:
        // MENOR PREÇO ESCOLHIDO COM 3 COTAÇÕES
              // Envio direto para aprovação conforme faixa de valor
        // OFERTA SUPERIOR OU MENOS DE 3 COTAÇÕES
              // Justificativa técnica/comercial OBRIGATÓRIA
   // ENCAMINHAMENTO: Define Alçada Requerida (Supervisão / Gerência / Diretoria)
   // DELIBERAÇÃO:
        // NÍVEL DO USUÁRIO >= ALÇADA EXIGIDA
              // Aprova (libera geração de Pedido PC) ou Reprova (devolve p/ cotação)
        // NÍVEL DO USUÁRIO < ALÇADA EXIGIDA
              // Bloqueia ação e orienta alternância de perfil na demonstração
   // RESULTADO FINAL: Compra homologada com rastreabilidade total
   ===================================================================== */

/* ---------------------------------------------------------------------
   Objeto Compras — Controlador central e escopo de métodos do módulo
   --------------------------------------------------------------------- */
const Compras = {
  // Filtros em memória para a listagem de Solicitações
  _scFiltros: {
    aba: 'todas',
    busca: '',
    prioridade: '',
    cliente: '',
    categoria: '',
  },

  // Filtros em memória para a listagem de Cotações
  _cotFiltros: {
    aba: 'todas',
    busca: '',
    status: '',
  },

  /* ===================================================================
     MÉTODOS DA PÁGINA: SOLICITAÇÕES DE COMPRA (SC)
     =================================================================== */

  // Atualiza o estado da aba de solicitações e redesenha a tabela
  setTabSC(abaId) {
    // Definindo a aba ativa no filtro
    this._scFiltros.aba = abaId;
    // Redesenhando o corpo da tabela de solicitações
    this.renderTabelaSC();
  },

  // Atualiza campo de busca textual ou filtros suspensos
  filtrarSC(campo, valor) {
    // Gravando o valor atualizado no estado local de filtros
    this._scFiltros[campo] = valor;
    // Redesenhando exclusivamente a tabela para não perder o foco do input
    this.renderTabelaSC();
  },

  // Retorna a lista de solicitações filtrada conforme critérios da tela
  obterSCFiltradas() {
    // Recuperando todas as solicitações registradas no Store
    const todas = Store.db.solicitacoes || [];
    const f = this._scFiltros;

    // Filtrando de acordo com a aba, busca e seletores ativos
    return todas.filter(s => {
      // Filtro de aba de status
      if (f.aba === 'abertas' && s.status !== 'Aberta') return false;
      if (f.aba === 'em_cotacao' && s.status !== 'Em cotação') return false;
      if (f.aba === 'aguardando_aprovacao' && s.status !== 'Aguardando aprovação') return false;
      if (f.aba === 'aprovadas_compradas' && !['Aprovada', 'Comprada'].includes(s.status)) return false;
      if (f.aba === 'canceladas' && s.status !== 'Cancelada') return false;

      // Filtro por prioridade
      if (f.prioridade && s.prioridade !== f.prioridade) return false;

      // Filtro por cliente / projeto
      if (f.cliente && s.cliente !== f.cliente) return false;

      // Filtro por categoria do item
      if (f.categoria && s.categoria !== f.categoria) return false;

      // Busca textual ampla
      if (f.busca && !U.match(f.busca, s.id, s.solicitante, s.area, s.cliente, s.centroCusto, s.descricao, s.especificacao)) {
        return false;
      }

      return true;
    });
  },

  // Atualiza o container da tabela de solicitações dinamicamente
  renderTabelaSC() {
    // Buscando o elemento de container da tabela na DOM
    const container = document.getElementById('sc-table-wrap');
    if (!container) return;

    // Obtendo as solicitações após aplicação dos filtros
    const lista = this.obterSCFiltradas();

    // Definição das colunas da tabela de solicitações
    const colunas = [
      {
        label: 'ID',
        render: s => `<span class="mono strong">${U.esc(s.id)}</span>`,
        width: '95px'
      },
      {
        label: 'Data / Nec.',
        render: s => `<div>${U.date(s.data)}</div><div class="cell-sub">Nec: ${U.date(s.dataNecessidade)}</div>`,
        width: '105px'
      },
      {
        label: 'Solicitante / Área',
        render: s => `<div class="cell-main">${U.esc(s.solicitante)}</div><div class="cell-sub">${U.esc(s.area)}</div>`
      },
      {
        label: 'Cliente / Centro de Custo',
        render: s => `<div class="cell-main">${U.esc(s.cliente)}</div><div class="cell-sub">${U.esc(s.centroCusto || 'Geral')}</div>`
      },
      {
        label: 'Material / Especificação',
        render: s => `<div class="cell-main">${U.esc(s.descricao)}</div><div class="cell-sub">${U.esc(s.especificacao || '—')}</div>`
      },
      {
        label: 'Qtd / Unid',
        align: 'right',
        render: s => `<span class="strong">${U.num(s.qtd)}</span> <span class="muted small">${U.esc(s.unid)}</span>`,
        width: '100px'
      },
      {
        label: 'Prioridade',
        align: 'center',
        render: s => UI.badge(s.prioridade),
        width: '105px'
      },
      {
        label: 'Status',
        align: 'center',
        render: s => UI.badge(s.status),
        width: '130px'
      },
      {
        label: 'Ações',
        align: 'right',
        render: s => this.renderAcoesSC(s),
        width: '160px'
      }
    ];

    // Injetando o HTML da tabela atualizada
    container.innerHTML = UI.table({
      columns: colunas,
      rows: lista,
      empty: 'Nenhuma solicitação encontrada com os filtros selecionados.',
      rowKey: 'id'
    });
  },

  // Monta os botões de ação contextuais para cada linha de solicitação
  renderAcoesSC(s) {
    // Array para acumular os botões de ação da linha
    const botoes = [];

    // Se estiver aberta, oferece atalho para iniciar cotação e cancelar
    if (s.status === 'Aberta') {
      botoes.push(UI.btn('Cotar', {
        icon: 'scale',
        size: 'xs',
        variant: 'primary',
        onclick: `Compras.cotarSC('${s.id}')`,
        title: 'Iniciar Mapa de Cotação'
      }));
      botoes.push(UI.btn('', {
        icon: 'trash',
        size: 'xs',
        variant: 'ghost',
        attrs: 'style="color:var(--error)"',
        onclick: `Compras.cancelarSC('${s.id}')`,
        title: 'Cancelar solicitação'
      }));
    } else if (s.status === 'Em cotação') {
      // Se já está em cotação, leva diretamente para o mapa
      botoes.push(UI.btn('Ver Cotação', {
        icon: 'scale',
        size: 'xs',
        variant: 'outline-orange',
        onclick: `Compras.abrirCotacaoPorSC('${s.id}')`,
        title: 'Abrir mapa comparativo'
      }));
    } else if (s.status === 'Aguardando aprovação') {
      // Se aguarda aprovação, oferece atalho para a tela de alçadas
      botoes.push(UI.btn('Alçada', {
        icon: 'checkCircle',
        size: 'xs',
        variant: 'dark',
        onclick: `App.go('aprovacoes')`,
        title: 'Ir para Central de Aprovações'
      }));
    }

    // Botão universal para visualizar detalhes completos
    botoes.push(UI.btn('', {
      icon: 'eye',
      size: 'xs',
      variant: 'ghost',
      onclick: `Compras.verDetalhesSC('${s.id}')`,
      title: 'Ver detalhes da solicitação'
    }));

    return `<div class="row" style="justify-content:flex-end;gap:4px">${botoes.join('')}</div>`;
  },

  // Modal para criação de uma nova Solicitação de Compra
  modalNovaSC() {
    // Gerando o próximo identificador sequencial (ex: SC-0010)
    const proximoId = Store.nextId('SC-', Store.db.solicitacoes);
    const usuarioAtual = Store.user();

    // Obtendo lista de clientes existentes para agilizar a digitação
    const clientesPredefinidos = [
      'Mercado Livre RC01',
      'Mercado Livre RC02',
      'Galpão Cajamar',
      'Condomínio Rochaverá',
      'CD B2W Louveira',
      'Hospital Alvorada',
      'Shopping Eldorado',
      'GHC Facilities Central'
    ];

    // Opções de materiais catalogados do estoque
    const opcoesEstoque = [
      { value: '', label: '— Material avulso / Não catalogado —' },
      ...Store.db.estoque.map(item => ({
        value: item.codigo,
        label: `${item.codigo} · ${item.material} (Saldo: ${item.atual} ${item.unid})`
      }))
    ];

    // Formulário em grid estilizado
    const corpoModal = `
      <div class="form-grid">
        <div class="form-section">1. Identificação e Origem da Demanda</div>
        ${UI.field({ name: 'id', label: 'Código SC', value: proximoId, readonly: true })}
        ${UI.field({ name: 'data', label: 'Data da Solicitação', type: 'date', value: U.today(), required: true })}
        ${UI.field({ name: 'solicitante', label: 'Solicitante', value: usuarioAtual.nome, required: true })}
        ${UI.field({ name: 'area', label: 'Área / Setor', value: usuarioAtual.perfil, required: true })}
        ${UI.field({ name: 'cliente', label: 'Cliente / Obra', type: 'select', options: clientesPredefinidos, required: true })}
        ${UI.field({ name: 'centroCusto', label: 'Centro de Custo', value: 'Meli RC01', placeholder: 'Ex: MANUT-PRED', required: true })}
        ${UI.field({ name: 'localEntrega', label: 'Local de Entrega', value: 'Almoxarifado Central - Barueri/SP', full: true, required: true })}

        <div class="form-section">2. Especificação do Material ou Serviço</div>
        ${UI.field({
          name: 'itemCodigo',
          label: 'Vincular a Item do Catálogo de Estoque',
          type: 'select',
          options: opcoesEstoque,
          full: true,
          hint: 'Ao selecionar um item do catálogo, a categoria, descrição e unidade são preenchidas automaticamente.'
        })}
        ${UI.field({ name: 'descricao', label: 'Descrição do Material / Serviço', placeholder: 'Nome claro e padronizado do material', full: true, required: true })}
        ${UI.field({ name: 'categoria', label: 'Categoria', type: 'select', options: Rules.CATEGORIAS, required: true })}
        ${UI.field({ name: 'prioridade', label: 'Prioridade', type: 'select', options: Rules.PRIORIDADES, value: 'Normal', required: true })}
        ${UI.field({ name: 'qtd', label: 'Quantidade', type: 'number', min: 1, step: 1, value: '1', required: true })}
        ${UI.field({ name: 'unid', label: 'Unidade', type: 'select', options: Rules.UNIDADES, value: 'un', required: true })}
        ${UI.field({ name: 'dataNecessidade', label: 'Data da Necessidade na Obra', type: 'date', value: U.addDays(U.today(), 5), required: true })}
        ${UI.field({ name: 'especificacao', label: 'Especificação Técnica Detalhada', type: 'textarea', placeholder: 'Marca recomendada, dimensões, norma técnica, CA para EPIs, etc.', full: true })}
        ${UI.field({ name: 'obs', label: 'Observações / Justificativa da Solicitação', type: 'textarea', placeholder: 'Motivo da compra (ex: reposição preventiva, atendimento de OS, corretiva urgente...)', full: true })}
      </div>
    `;

    // Abrindo o modal de cadastro
    UI.modal({
      title: 'Nova Solicitação de Compra',
      sub: 'Preencha os dados da requisição de suprimentos ou serviços.',
      size: 'lg',
      body: corpoModal,
      submitLabel: 'Salvar Solicitação',
      onOpen: form => {
        // Monitora seleção de item do estoque para autopreenchimento
        const selItem = form.querySelector('[name=itemCodigo]');
        const fDesc = form.querySelector('[name=descricao]');
        const fCat = form.querySelector('[name=categoria]');
        const fUnid = form.querySelector('[name=unid]');

        selItem.addEventListener('change', () => {
          const cod = selItem.value;
          if (cod) {
            const item = Store.item(cod);
            if (item) {
              fDesc.value = item.material;
              fCat.value = item.categoria;
              fUnid.value = item.unid;
            }
          }
        });
      },
      onSubmit: valores => {
        // Montando o novo objeto de solicitação de compra
        const novaSC = {
          id: proximoId,
          data: valores.data || U.today(),
          solicitante: valores.solicitante.trim(),
          area: valores.area.trim(),
          cliente: valores.cliente,
          centroCusto: valores.centroCusto.trim(),
          localEntrega: valores.localEntrega.trim(),
          categoria: valores.categoria,
          descricao: valores.descricao.trim(),
          especificacao: valores.especificacao ? valores.especificacao.trim() : '',
          qtd: U.parseNum(valores.qtd) || 1,
          unid: valores.unid,
          prioridade: valores.prioridade,
          status: 'Aberta',
          dataNecessidade: valores.dataNecessidade || U.addDays(U.today(), 5),
          obs: valores.obs ? valores.obs.trim() : '',
          itemCodigo: valores.itemCodigo || undefined,
        };

        // Persistindo no banco de dados local
        Store.db.solicitacoes.unshift(novaSC);
        Store.commit(`Solicitação ${novaSC.id} criada com sucesso!`);
      }
    });
  },

    const sc = Store.sc(scId);
    if (!sc) return;

    // Buscando cotação e pedido relacionados caso existam
    const cot = Store.cotBySc(scId);
    const pedido = Store.pedidoBySc(scId);

    // Estruturando o corpo do modal com lista de definições
    const html = `
      <div class="stack" style="gap:18px">
        <div class="row between" style="padding-bottom:12px;border-bottom:1px solid var(--border)">
          <div>
            <div class="eyebrow">${U.esc(sc.categoria)} · ${U.esc(sc.prioridade)}</div>
            <h2 style="font-size:20px;margin-top:2px">${U.esc(sc.descricao)}</h2>
          </div>
          <div class="row" style="gap:8px">
            ${UI.badge(sc.prioridade)}
            ${UI.badge(sc.status)}
          </div>
        </div>

        <div class="dl">

          <dd><strong class="mono">${U.esc(sc.id)}</strong></dd>

          <dd><span class="strong">${U.date(sc.dataNecessidade)}</span></dd>

          <dt>Solicitante:</dt>
          <dd>${U.esc(sc.solicitante)} (${U.esc(sc.area)})</dd>

          <dt>Cliente / Contrato:</dt>
